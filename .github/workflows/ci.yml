name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: src
  # CI에는 API 키가 없다. 엔진은 template/sLLM 티어로만 돌아야 하고,
  # 그 상태에서도 전체 파이프라인과 벤치마크 평가가 성공해야 한다.
  AEGIS_GENERATION__PROVIDER: template

jobs:
  core:
    name: core (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install (core + dev only — no torch/tensorflow)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[llm,dev]"
      - name: Lint
        run: ruff check src tests scripts
      - name: Build demo database (small scale)
        run: python scripts/build_demo_db.py --scale 0.25 --force
      - name: Build & validate benchmark (gold SQL must execute)
        run: python scripts/build_benchmark.py
      - name: Tests
        run: pytest -q -m "not slow" --maxfail=1
      - name: End-to-end smoke (no API key, no GPU)
        run: |
          python -m aegis_sql.cli demo --limit 3
          python -m aegis_sql.cli eval --limit 15 --report reports/ci-eval.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report-py${{ matrix.python }}
          path: reports/

  ml:
    name: ml stack (torch + tensorflow)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install full stack
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"
      - run: python scripts/build_demo_db.py --scale 0.25 --force
      - name: Flywheel (synthetic training data from the schema alone)
        run: python -m aegis_sql.cli flywheel --n-programs 400
      - name: Train the cascade router (Keras) and export numpy weights
        run: python scripts/train_router.py --out data/generated/router --epochs 20
      - name: Train the in-house sLLM (PyTorch, CPU, tiny config)
        run: python scripts/train_slm.py --data-dir data/generated/flywheel --out data/generated/slm --epochs 1 --smoke
      - name: ML-marked tests
        run: pytest -q -m "slow"

  docker:
    name: docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t aegis-sql:ci .
      - name: Health check
        run: |
          docker run -d --name aegis -p 8000:8000 aegis-sql:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/v1/health; then ok=1; break; fi
            sleep 2
          done
          test "$ok" = "1"
          curl -fsS -X POST http://localhost:8000/v1/query \
            -H 'content-type: application/json' \
            -d '{"question":"실효된 계약은 몇 건이야?"}' | head -c 500
          docker rm -f aegis
