name: PR20 one-shot evidence polish

on:
  push:
    branches: [chore/final-quality-polish]

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/final-quality-polish
          fetch-depth: 0

      - name: Apply exact evidence-only replacements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}: {old!r}")
              p.write_text(text.replace(old, new), encoding="utf-8")

          replace_once(
              "src/aegis_sql/router/cascade.py",
              "    SLM       → in-house 15M-parameter model, $0 marginal, ~200 ms",
              "    SLM       → in-house 5.3M-parameter model, local, default-disabled until promoted",
          )

          replace_once(
              "docs/SLM.md",
              "4코어 CPU에서 몇 분 안에 학습이 끝난다. 스케일업 시 그대로 확장되는 코드다.",
              "빠른 스모크 경로는 4코어 CPU에서 약 2분, 공개 5.3M 체크포인트의 전체 SFT+DPO 실측은 약 61분이다. 스케일업 시 같은 학습 코드를 사용한다.",
          )

          replace_once(
              ".gitignore",
              "# Generated artefacts — reproducible via `make setup` / `make flywheel` / `make train`",
              "# Generated artefacts — reproducible via `make setup` / `make flywheel` / `make train-slm`",
          )

          replace_once(
              "README.md",
              "**한국 금융·보험사의 레거시 스키마 위에서 동작하는<br/>거버넌스 내장형 자가개선 Text-to-SQL 엔진**",
              "**한국 금융·보험사의 레거시 스키마 위에서 동작하는<br/>거버넌스 내장형 Text-to-SQL 엔진**",
          )

          replace_once(
              "README.md",
              "자세한 내용: [`docs/ARCHITECTURE.md`](docs/ARCHITECTURE.md)\n\n### 설계 원칙 4가지",
              "자세한 내용: [`docs/ARCHITECTURE.md`](docs/ARCHITECTURE.md)\n\n> **오프라인 개선 루프의 범위:** 실행·교정 로그를 선호 데이터로 되돌려 재학습하는 구조이지, 런타임에서 모델이 스스로 가중치를 바꾸는 시스템이 아닙니다. 현재 공개 5.3M 체크포인트는 실제 운영 교정 로그가 없어 DPO 900쌍을 합성 선호쌍으로 구성했으며, 이는 DPO 구현 검증 범위로만 해석합니다.\n\n### 설계 원칙 4가지",
          )

          replace_once(
              "README.md",
              "│   ├── generation/         template / sLLM / LLM 3티어 + SQL 스켈레톤",
              "│   ├── generation/         TEMPLATE / SLM / LLM / ENSEMBLE 4티어 ladder + SQL 스켈레톤",
          )

          replace_once(
              "README.md",
              "template은 GitHub Actions의 Ubuntu·Python 3.13에서 전체 373,778행 DB로 다시 측정했습니다.\nLLM 열의 모델은 `claude-sonnet-5`. 실측 총비용은 단독 약 $1.1, 캐스케이드 약 $2.5.",
              "보관된 template full-scale 리포트는 Ubuntu·Python 3.13, 전체 373,778행 DB에서 측정한 역사적 증거입니다. 현재 PR CI는 회귀 속도를 위해 0.25배 DB(93,703행)를 새로 빌드해 Python 3.10/3.11/3.12에서 검증하며, 두 측정 조건을 섞지 않습니다.\nLLM 열의 모델은 `claude-sonnet-5`. 실측 총비용은 단독 약 $1.1, 캐스케이드 약 $2.5.",
          )

          # Keep the plan honest about the reviewed implementation choice.
          plan = Path("docs/superpowers/plans/2026-09-15-final-quality-polish.md")
          text = plan.read_text(encoding="utf-8")
          marker = "**Architecture:** Keep runtime behavior unchanged except for one deliberate safety invariant: when governance is enabled, every physical schema column must have an explicit sensitivity grade. Preserve `PolicyDocument.permissive()` for policy-disabled test/dev flows. Documentation fixes are evidence-only changes: no new performance claims and no retroactive provenance edits."
          replacement = "**Architecture:** Keep query behavior unchanged while making governance fail closed in two layers: unclassified columns default to `forbidden` at runtime, and CI requires every demo schema column to have an explicit grade. Documentation fixes are evidence-only changes: no new performance claims and no retroactive provenance edits."
          if marker in text:
              text = text.replace(marker, replacement, 1)
          note = "\n> **Implementation review note:** The initial plan proposed a runtime startup exception for incomplete classification. Review found the safer current design already supports a `forbidden` fallback, so the final implementation uses that fail-closed runtime default plus an explicit CI completeness test instead of adding unnecessary startup coupling.\n"
          if "Implementation review note" not in text:
              text = text.replace("**Spec:** Current repository evidence plus the final application review checklist discussed on 2026-09-15.\n", "**Spec:** Current repository evidence plus the final application review checklist discussed on 2026-09-15.\n" + note, 1)
          plan.write_text(text, encoding="utf-8")

          # Normalize the tiny config file's missing final newline spotted in the PR diff.
          cfg = Path("configs/default.yaml")
          cfg_text = cfg.read_text(encoding="utf-8")
          cfg.write_text(cfg_text.rstrip("\n") + "\n", encoding="utf-8")
          PY

          git diff --check
          git diff -- src/aegis_sql/router/cascade.py docs/SLM.md .gitignore README.md configs/default.yaml docs/superpowers/plans/2026-09-15-final-quality-polish.md

      - name: Commit polished evidence text
        shell: bash
        run: |
          rm .github/workflows/pr20-one-shot-polish.yml
          git config user.name "sokldjs554"
          git config user.email "97650034+sokldjs554@users.noreply.github.com"
          git add src/aegis_sql/router/cascade.py docs/SLM.md .gitignore README.md configs/default.yaml docs/superpowers/plans/2026-09-15-final-quality-polish.md .github/workflows/pr20-one-shot-polish.yml
          git commit -m "docs: reconcile final evidence claims"
          git push origin HEAD:chore/final-quality-polish
