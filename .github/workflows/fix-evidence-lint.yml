name: fix-evidence-lint

on:
  push:
    branches:
      - research/spider-ko-final-evidence

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/spider-ko-final-evidence
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply ruff fix and remove helper
        shell: bash
        run: |
          python -m pip install ruff==0.16.7
          ruff check --fix tests/test_spider_ko_evidence.py
          rm .github/workflows/fix-evidence-lint.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_spider_ko_evidence.py .github/workflows/fix-evidence-lint.yml
          git diff --cached --check
          git commit -m 'style: format Spider-KO evidence test'
          git push origin HEAD:research/spider-ko-final-evidence
