name: fix-readme-typo

on:
  push:
    branches:
      - research/spider-ko-final-evidence

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/spider-ko-final-evidence
      - name: Fix typo and remove helper
        shell: bash
        run: |
          python -c "from pathlib import Path; p=Path('README.md'); s=p.read_text(encoding='utf-8'); assert s.count('*++2.32%p**') == 1; p.write_text(s.replace('*++2.32%p**', '**+2.32%p**'), encoding='utf-8')"
          rm .github/workflows/fix-readme-typo.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md .github/workflows/fix-readme-typo.yml
          git diff --cached --check
          git commit -m 'docs: fix Spider-KO README emphasis'
          git push origin HEAD:research/spider-ko-final-evidence
