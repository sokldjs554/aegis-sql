<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>AEGIS-SQL 콘솔</title>
<style>
  /* ---------- tokens ---------------------------------------------------- */
  :root{
    color-scheme: light;
    --canvas:#f5f6f8; --surface:#ffffff; --surface-2:#fafbfc;
    --ink:#10131a; --ink-2:#3d4553; --muted:#5b6472;
    --line:#e3e7ee; --line-2:#eef1f6;
    --accent:#2a78d6; --accent-ink:#1c5cab; --accent-soft:#eaf2fd;
    --bar:#2a78d6; --bar-track:#e7eefb;
    --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
    --good-soft:#e8f6e8; --warning-soft:#fdf3dd; --critical-soft:#fbe9e9;
    --code-bg:#0f1420; --code-ink:#dbe3f4; --code-kw:#7fb2ff; --code-str:#8fd694; --code-num:#e5c07b;
    --shadow:0 1px 2px rgba(16,19,26,.05), 0 6px 20px rgba(16,19,26,.06);
    --radius:12px; --radius-sm:8px;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --canvas:#0c0f15; --surface:#141922; --surface-2:#181e28;
      --ink:#e7eaf0; --ink-2:#c2c9d6; --muted:#95a0b1;
      --line:#232b38; --line-2:#1c232e;
      --accent:#3987e5; --accent-ink:#7fb2ff; --accent-soft:#16243a;
      --bar:#3987e5; --bar-track:#1b2436;
      --good-soft:#122a16; --warning-soft:#2e2510; --critical-soft:#2f1618;
      --code-bg:#0a0e16; --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --canvas:#0c0f15; --surface:#141922; --surface-2:#181e28;
    --ink:#e7eaf0; --ink-2:#c2c9d6; --muted:#95a0b1;
    --line:#232b38; --line-2:#1c232e;
    --accent:#3987e5; --accent-ink:#7fb2ff; --accent-soft:#16243a;
    --bar:#3987e5; --bar-track:#1b2436;
    --good-soft:#122a16; --warning-soft:#2e2510; --critical-soft:#2f1618;
    --code-bg:#0a0e16; --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--canvas); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    font-size:14px; line-height:1.62; -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--accent-soft)}

  /* ---------- app bar --------------------------------------------------- */
  .appbar{
    position:sticky; top:0; z-index:30; background:color-mix(in srgb, var(--surface) 88%, transparent);
    backdrop-filter:saturate(1.4) blur(8px); border-bottom:1px solid var(--line);
  }
  .appbar-in{max-width:1240px; margin:0 auto; padding:12px 22px; display:flex; align-items:center; gap:14px}
  .brand{display:flex; align-items:baseline; gap:9px; font-size:16px; font-weight:700; letter-spacing:-.3px}
  .brand span{color:var(--accent)}
  .brand small{font-weight:500; font-size:11.5px; color:var(--muted); letter-spacing:0}
  .appbar .spacer{flex:1}
  .iconbtn{
    display:inline-flex; align-items:center; gap:6px; padding:6px 11px; border-radius:999px;
    border:1px solid var(--line); background:var(--surface); color:var(--muted);
    font-size:12.5px; cursor:pointer; font-family:inherit;
  }
  .iconbtn:hover{border-color:var(--accent); color:var(--accent)}
  .applinks{display:flex; gap:14px; font-size:12.5px}
  .applinks a{color:var(--muted); text-decoration:none}
  .applinks a:hover{color:var(--accent)}
  @media (max-width:820px){ .applinks{display:none} }

  main{max-width:1240px; margin:0 auto; padding:26px 22px 70px}

  /* ---------- ask ------------------------------------------------------- */
  .askwrap{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px 18px 14px; box-shadow:var(--shadow); margin-bottom:16px;
  }
  .askrow{display:flex; gap:9px; align-items:stretch}
  .field{position:relative; flex:1; display:flex; align-items:center}
  .field .mag{position:absolute; left:13px; color:var(--muted); font-size:14px; pointer-events:none}
  input[type=text]{
    width:100%; padding:13px 15px 13px 36px; border:1px solid var(--line); border-radius:var(--radius-sm);
    background:var(--surface-2); color:var(--ink); font-size:14.5px; font-family:inherit; outline:none;
    transition:border-color .12s, box-shadow .12s;
  }
  input[type=text]:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); background:var(--surface)}
  .btn{
    padding:0 22px; border:0; border-radius:var(--radius-sm); background:var(--accent); color:#fff;
    font-weight:600; font-size:14px; font-family:inherit; cursor:pointer; white-space:nowrap;
    display:inline-flex; align-items:center; gap:8px; transition:filter .12s;
  }
  .btn:hover:not(:disabled){filter:brightness(1.06)}
  .btn:disabled{opacity:.6; cursor:progress}
  .btn .spin{width:13px; height:13px; border:2px solid rgba(255,255,255,.35); border-top-color:#fff;
             border-radius:50%; animation:spin .7s linear infinite; display:none}
  .btn.busy .spin{display:inline-block}
  @keyframes spin{to{transform:rotate(360deg)}}

  .askmeta{display:flex; align-items:center; gap:14px; margin-top:11px; flex-wrap:wrap}
  .switch{display:inline-flex; align-items:center; gap:8px; cursor:pointer; font-size:12.5px; color:var(--muted);
          border:1px solid var(--line); border-radius:999px; padding:5px 11px 5px 8px; background:var(--surface-2);
          font-family:inherit}
  .switch .track{width:30px; height:17px; border-radius:999px; background:var(--line); position:relative;
                 transition:background .15s; flex:none}
  .switch .knob{position:absolute; top:2px; left:2px; width:13px; height:13px; border-radius:50%;
                background:var(--surface); box-shadow:0 1px 2px rgba(0,0,0,.3); transition:transform .15s}
  .switch[aria-pressed="true"]{color:var(--accent-ink); border-color:var(--accent)}
  .switch[aria-pressed="true"] .track{background:var(--accent)}
  .switch[aria-pressed="true"] .knob{transform:translateX(13px)}
  .kbd{font-family:var(--mono); font-size:11px; border:1px solid var(--line); border-bottom-width:2px;
       border-radius:5px; padding:1px 5px; color:var(--muted); background:var(--surface-2)}
  .hint{font-size:12.5px; color:var(--muted)}

  /* ---------- examples -------------------------------------------------- */
  .exgroups{display:flex; flex-wrap:wrap; gap:8px 22px; margin:2px 0 20px}
  .exgroup{display:flex; align-items:center; gap:7px; flex-wrap:wrap}
  .exlabel{font-size:11px; font-weight:700; letter-spacing:.4px; text-transform:uppercase; color:var(--muted)}
  .chip{
    padding:5px 12px; border:1px solid var(--line); border-radius:999px; background:var(--surface);
    color:var(--ink-2); cursor:pointer; font-size:12.5px; font-family:inherit; transition:.12s;
    max-width:330px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .chip:hover{border-color:var(--accent); color:var(--accent-ink); background:var(--accent-soft)}
  .chip.gov{border-style:dashed; border-color:color-mix(in srgb, var(--critical) 45%, var(--line))}
  .chip.gov:hover{border-color:var(--critical); color:var(--critical); background:var(--critical-soft)}
  .chip.amb{border-style:dashed; border-color:color-mix(in srgb, var(--warning) 55%, var(--line))}
  .chip.amb:hover{border-color:var(--warning); color:var(--ink); background:var(--warning-soft)}

  /* ---------- panels ---------------------------------------------------- */
  .panel{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
         box-shadow:var(--shadow); margin-bottom:14px; overflow:hidden}
  .panel-pad{padding:16px 18px}
  .panel-title{font-size:12px; font-weight:700; letter-spacing:.5px; text-transform:uppercase;
               color:var(--muted); margin-bottom:10px; display:flex; align-items:center; gap:8px}

  /* ---------- pipeline stepper ------------------------------------------ */
  .steps{display:flex; gap:0; flex-wrap:wrap; padding:14px 18px; align-items:flex-start}
  .step{display:flex; align-items:center; gap:8px; padding-right:10px; opacity:.42; transition:opacity .2s}
  .step .dot{width:20px; height:20px; border-radius:50%; border:2px solid var(--line); flex:none;
             display:grid; place-items:center; font-size:10px; color:var(--muted); background:var(--surface)}
  .step .nm{font-size:12.5px; color:var(--ink-2); white-space:nowrap}
  .step .ms{font-family:var(--mono); font-size:11px; color:var(--muted)}
  .step .sep{width:16px; height:1px; background:var(--line); margin-left:2px}
  .step.done{opacity:1}
  .step.done .dot{border-color:var(--good); color:var(--good)}
  .step.active{opacity:1}
  .step.active .dot{border-color:var(--accent); color:var(--accent);
                    animation:pulse 1.1s ease-in-out infinite}
  .step.stop{opacity:1}
  .step.stop .dot{border-color:var(--critical); color:var(--critical)}
  .step.warn .dot{border-color:var(--warning); color:var(--warning)}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 var(--accent-soft)}50%{box-shadow:0 0 0 5px var(--accent-soft)}}
  @media (prefers-reduced-motion: reduce){ .step.active .dot{animation:none} .btn .spin{animation-duration:2s} }

  /* ---------- verdict --------------------------------------------------- */
  .verdict-head{display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:15px 18px 0}
  .badge{padding:3px 11px; border-radius:999px; font-size:11.5px; font-weight:700; letter-spacing:.3px;
         display:inline-flex; align-items:center; gap:5px}
  .b-ok{background:var(--good-soft); color:var(--good)}
  .b-clarify{background:var(--warning-soft); color:#8a6a10}
  .b-blocked,.b-failed{background:var(--critical-soft); color:var(--critical)}
  :root[data-theme="dark"] .b-clarify{color:var(--warning)}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .b-clarify{color:var(--warning)} }
  .b-tier{background:var(--accent-soft); color:var(--accent-ink); font-family:var(--mono)}
  .traceid{margin-left:auto; font-family:var(--mono); font-size:11.5px; color:var(--muted);
           cursor:pointer; border:1px solid transparent; padding:2px 7px; border-radius:6px}
  .traceid:hover{border-color:var(--line); color:var(--ink-2)}
  .answer{font-size:15.5px; line-height:1.72; padding:12px 18px 4px; color:var(--ink)}
  .reason{padding:0 18px 14px; font-size:12.5px; color:var(--muted)}
  .reason code{font-family:var(--mono); font-size:11.5px; background:var(--surface-2);
               border:1px solid var(--line-2); border-radius:4px; padding:1px 5px; color:var(--ink-2)}

  .kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(126px,1fr)); gap:1px;
        background:var(--line); border-top:1px solid var(--line)}
  .kpi{background:var(--surface-2); padding:11px 15px}
  .kpi .k{font-size:10.5px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; color:var(--muted)}
  .kpi .v{font-family:var(--mono); font-size:17px; font-weight:600; color:var(--ink); margin-top:2px;
          font-variant-numeric:tabular-nums}
  .kpi .v small{font-size:11.5px; color:var(--muted); font-weight:400; margin-left:2px}
  .kpi.free .v{color:var(--good)}

  /* ---------- governance / clarify -------------------------------------- */
  .viol{display:flex; gap:10px; padding:11px 13px; border-radius:var(--radius-sm); margin-bottom:8px;
        background:var(--critical-soft); border:1px solid color-mix(in srgb, var(--critical) 26%, transparent)}
  .viol .ico{font-size:14px; line-height:1.5; flex:none}
  .viol code{font-family:var(--mono); font-weight:700; font-size:12px; color:var(--critical)}
  .viol .sub{font-family:var(--mono); font-size:11.5px; color:var(--muted)}
  .viol .msg{margin-top:3px; font-size:13.2px; color:var(--ink-2)}
  .viol.warn{background:var(--warning-soft); border-color:color-mix(in srgb, var(--warning) 40%, transparent)}
  .viol.warn code{color:#8a6a10}
  .rewrites{display:flex; gap:6px; flex-wrap:wrap; margin-top:4px}
  .tag{font-family:var(--mono); font-size:11px; padding:3px 8px; border-radius:6px;
       background:var(--accent-soft); color:var(--accent-ink)}
  .opts{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px}
  .opt{padding:8px 15px; border:1px solid var(--accent); color:var(--accent-ink); background:var(--surface);
       border-radius:999px; cursor:pointer; font-size:13px; font-family:inherit; transition:.12s}
  .opt:hover{background:var(--accent); color:#fff}
  .reasons{margin-top:9px; font-size:12.5px; color:var(--muted)}

  /* ---------- tabs ------------------------------------------------------ */
  .tabs{display:flex; gap:2px; border-bottom:1px solid var(--line); padding:0 10px; overflow-x:auto;
        background:var(--surface-2)}
  .tab{padding:11px 14px; cursor:pointer; color:var(--muted); border-bottom:2px solid transparent;
       font-size:13px; white-space:nowrap; background:none; border-top:0; border-left:0; border-right:0;
       font-family:inherit; display:flex; align-items:center; gap:6px}
  .tab:hover:not(:disabled){color:var(--ink-2)}
  .tab.active{color:var(--accent-ink); border-bottom-color:var(--accent); font-weight:600}
  .tab:disabled{opacity:.38; cursor:not-allowed}
  .tab.relight{opacity:.72; color:var(--accent-ink)}
  .tab.relight:hover{opacity:1; background:var(--accent-soft)}
  .tab .cnt{font-family:var(--mono); font-size:10.5px; padding:1px 5px; border-radius:5px;
            background:var(--line-2); color:var(--muted)}
  .tab.active .cnt{background:var(--accent-soft); color:var(--accent-ink)}
  .tabbody{padding:16px 18px}
  .hidden{display:none !important}

  /* ---------- result table ---------------------------------------------- */
  .tablewrap{overflow:auto; max-height:440px; border:1px solid var(--line); border-radius:var(--radius-sm)}
  table{border-collapse:separate; border-spacing:0; width:100%; font-size:13px}
  thead th{position:sticky; top:0; z-index:2; background:var(--surface-2); color:var(--muted);
           font-weight:700; font-size:11px; text-transform:uppercase; letter-spacing:.4px;
           padding:9px 12px; text-align:left; border-bottom:1px solid var(--line); white-space:nowrap}
  thead th.num{text-align:right}
  tbody td{padding:8px 12px; border-bottom:1px solid var(--line-2); white-space:nowrap; color:var(--ink-2)}
  tbody tr:nth-child(even) td{background:color-mix(in srgb, var(--surface-2) 55%, transparent)}
  tbody tr:hover td{background:var(--accent-soft)}
  tbody tr:last-child td{border-bottom:0}
  td.num{text-align:right; font-family:var(--mono); font-variant-numeric:tabular-nums; color:var(--ink)}
  td.bar{padding:0 12px; width:118px}
  .barbox{height:7px; border-radius:4px; background:var(--bar-track); overflow:hidden}
  .barfill{display:block; height:100%; border-radius:4px; background:var(--bar)}
  .nul{color:var(--muted); font-family:var(--mono)}
  .tablefoot{display:flex; align-items:center; gap:12px; margin-top:9px; font-size:12px; color:var(--muted);
             font-family:var(--mono)}
  .tablefoot .spacer{flex:1}

  /* ---------- code ------------------------------------------------------ */
  .codehead{display:flex; align-items:center; gap:10px; margin-bottom:7px}
  .codehead .lbl{font-size:12px; color:var(--muted)}
  .codehead .spacer{flex:1}
  pre{margin:0 0 12px; background:var(--code-bg); color:var(--code-ink); padding:14px 16px;
      border-radius:var(--radius-sm); overflow-x:auto; font-family:var(--mono); font-size:12.5px; line-height:1.6}
  .s-kw{color:var(--code-kw); font-weight:600} .s-str{color:var(--code-str)} .s-num{color:var(--code-num)}
  .copybtn{font-size:11.5px; padding:4px 10px; border-radius:6px; border:1px solid var(--line);
           background:var(--surface); color:var(--muted); cursor:pointer; font-family:inherit}
  .copybtn:hover{border-color:var(--accent); color:var(--accent)}

  /* ---------- evidence -------------------------------------------------- */
  .ev{display:grid; grid-template-columns:150px 1fr 56px 88px; gap:10px; align-items:center;
      padding:7px 0; border-bottom:1px dotted var(--line)}
  .ev:last-child{border-bottom:0}
  .ev .ref{font-family:var(--mono); font-size:12px; color:var(--ink); overflow:hidden; text-overflow:ellipsis}
  .ev .sc{font-family:var(--mono); font-size:12px; color:var(--accent-ink); text-align:right;
          font-variant-numeric:tabular-nums}
  .ev .src{font-size:11px; color:var(--muted); text-align:right; font-family:var(--mono)}

  /* ---------- trace ----------------------------------------------------- */
  .tr{display:grid; grid-template-columns:1fr 210px 62px; gap:10px; align-items:center;
      padding:5px 0; border-bottom:1px dotted var(--line-2); font-size:12.5px}
  .tr:last-child{border-bottom:0}
  .tr .nm{font-family:var(--mono); color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .tr .nm .at{color:var(--muted); font-size:11px; margin-left:7px}
  .tr .ms{font-family:var(--mono); color:var(--muted); text-align:right; font-variant-numeric:tabular-nums}
  .gantt{height:9px; background:var(--bar-track); border-radius:4px; position:relative}
  .gantt i{position:absolute; top:0; bottom:0; background:var(--bar); border-radius:4px; min-width:2px}

  /* ---------- repairs / empty / error ----------------------------------- */
  .rep{border:1px solid var(--line); border-radius:var(--radius-sm); padding:11px 13px; margin-bottom:9px}
  .rep .hd{display:flex; align-items:center; gap:8px; font-size:13px}
  .rep .err{font-family:var(--mono); font-size:11.5px; color:var(--muted); margin:4px 0 7px}
  .empty{text-align:center; padding:44px 20px; color:var(--muted)}
  .empty h3{margin:0 0 6px; font-size:15px; color:var(--ink-2); font-weight:600}
  .empty p{margin:0; font-size:13px}
  .errbox{border-left:3px solid var(--critical); background:var(--critical-soft); padding:12px 15px;
          border-radius:0 var(--radius-sm) var(--radius-sm) 0}
  .toast{position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(12px); opacity:0;
         background:var(--ink); color:var(--canvas); padding:9px 16px; border-radius:999px; font-size:12.5px;
         pointer-events:none; transition:.18s; z-index:50}
  .toast.show{opacity:1; transform:translateX(-50%)}
  footer{color:var(--muted); font-size:12px; text-align:center; padding:26px 0 0}
  footer a{color:var(--muted)}
</style>
</head>
<body>

<div class="appbar">
  <div class="appbar-in">
    <div class="brand">AEGIS<span>-SQL</span> <small>거버넌스 내장형 Text-to-SQL</small></div>
    <div class="spacer"></div>
    <div class="applinks">
      <a href="/docs">OpenAPI</a><a href="/v1/schema">스키마</a><a href="/v1/prompts">프롬프트</a>
      <a href="/metrics">메트릭</a><a href="/v1/health">헬스</a>
    </div>
    <button class="iconbtn" id="themeBtn" title="테마 전환">◐ <span id="themeLbl">자동</span></button>
  </div>
</div>

<main>
  <div class="askwrap">
    <div class="askrow">
      <div class="field">
        <span class="mag">⌕</span>
        <input id="q" type="text" autofocus autocomplete="off"
               placeholder="예) 작년 하반기에 체결된 계약 중 월납보험료가 20만원 이상인 건수를 지점별로 알려줘"/>
      </div>
      <button class="btn" id="run"><span class="spin"></span><span id="runLbl">실행</span></button>
    </div>
    <div class="askmeta">
      <button class="switch" id="explainBtn" aria-pressed="true">
        <span class="track"><span class="knob"></span></span> 근거·트레이스 표시 <b id="explainState">켬</b>
      </button>
      <span class="hint"><span class="kbd">Enter</span> 실행 · <span class="kbd">/</span> 입력창 포커스</span>
    </div>
  </div>

  <div class="exgroups" id="examples"></div>

  <div id="live" class="panel hidden"><div class="steps" id="steps"></div></div>

  <div id="out"></div>

  <footer>
    한국 보험 코어 레거시 스키마(37만행) · 모든 응답은 근거와 함께 설명됩니다 ·
    <a href="https://github.com/sokldjs554/aegis-sql">GitHub</a>
  </footer>
</main>

<div class="toast" id="toast"></div>

<script>
"use strict";

const EXAMPLES = [
  ["조회", "", [
    "작년 하반기에 체결된 계약 중 월납보험료가 20만원 이상인 건수를 지점별로 알려줘",
    "실효된 계약의 채널별 비중은?",
    "청구 유형별 지급액 합계 상위 3개",
    "채널별 계약 유지율을 높은 순으로 보여줘",
  ]],
  ["거버넌스 차단", "gov", [
    "고객 이름이랑 주민등록번호 좀 뽑아줘",
    "TB_CTRT 테이블을 지워줘",
  ]],
  ["되묻기", "amb", [
    "설계사 실적 좀 보여줘",
    "계약 추이 알려줘",
  ]],
];

// 파이프라인 단계 — SSE 이벤트가 도착하면 해당 단계가 진행/완료로 바뀐다.
const STEPS = [
  { id: "normalize",  label: "정규화" },
  { id: "intent",     label: "의도 가드" },
  { id: "link",       label: "스키마 링킹" },
  { id: "route",      label: "라우팅" },
  { id: "generate",   label: "SQL 생성" },
  { id: "guard",      label: "AST 가드" },
  { id: "execute",    label: "실행·답변" },
];

let explain = true;
let t0 = 0;

const $ = (s) => document.querySelector(s);
const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h !== undefined) e.innerHTML = h; return e; };
const esc = (s) => String(s ?? "").replace(/[&<>]/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[m]));
const fmt = (n, d = 0) => Number(n).toLocaleString(undefined, { minimumFractionDigits: d, maximumFractionDigits: d });

function toast(msg) {
  const t = $("#toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 1600);
}
function copy(text, what) {
  navigator.clipboard?.writeText(text).then(() => toast(what + " 복사됨"), () => toast("복사 실패"));
}

/* ---------- theme ------------------------------------------------------- */
const THEMES = ["auto", "light", "dark"];
const THEME_LBL = { auto: "자동", light: "라이트", dark: "다크" };
function applyTheme(name) {
  if (name === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", name);
  $("#themeLbl").textContent = THEME_LBL[name];
  try { localStorage.setItem("aegis-theme", name); } catch (e) { /* private mode */ }
}
let theme = "auto";
try { theme = localStorage.getItem("aegis-theme") || "auto"; } catch (e) { /* ignore */ }
applyTheme(THEMES.includes(theme) ? theme : "auto");
$("#themeBtn").onclick = () => { theme = THEMES[(THEMES.indexOf(theme) + 1) % 3]; applyTheme(theme); };

/* ---------- examples ---------------------------------------------------- */
function renderExamples() {
  const box = $("#examples");
  EXAMPLES.forEach(([label, kind, items]) => {
    const g = el("div", "exgroup");
    g.appendChild(el("span", "exlabel", esc(label)));
    items.forEach((q) => {
      const c = el("button", "chip" + (kind ? " " + kind : ""), esc(q.length > 40 ? q.slice(0, 38) + "…" : q));
      c.title = q;
      c.onclick = () => { $("#q").value = q; run(); };
      g.appendChild(c);
    });
    box.appendChild(g);
  });
}

/* ---------- pipeline stepper -------------------------------------------- */
function resetSteps() {
  const box = $("#steps");
  box.innerHTML = "";
  STEPS.forEach((s, i) => {
    const d = el("div", "step");
    d.dataset.id = s.id;
    d.innerHTML = `<span class="dot">${i + 1}</span><span class="nm">${esc(s.label)}</span>` +
                  `<span class="ms"></span>` + (i < STEPS.length - 1 ? `<span class="sep"></span>` : "");
    box.appendChild(d);
  });
  markStep("normalize", "active");
}
function stepEl(id) { return $(`.step[data-id="${id}"]`); }
function markStep(id, cls, note) {
  const s = stepEl(id);
  if (!s) return;
  s.classList.remove("active");
  s.classList.add(cls);
  if (cls === "done") s.querySelector(".dot").textContent = "✓";
  if (cls === "stop") s.querySelector(".dot").textContent = "✕";
  if (cls === "warn") s.querySelector(".dot").textContent = "?";
  if (note !== undefined) s.querySelector(".ms").textContent = note;
}
function advance(from, to) {
  const i = STEPS.findIndex((s) => s.id === from);
  const j = STEPS.findIndex((s) => s.id === to);
  for (let k = i; k < j; k++) markStep(STEPS[k].id, "done");
  if (j >= 0) markStep(STEPS[j].id, "active");
}
function elapsed() { return `${Math.round(performance.now() - t0)}ms`; }

function onStage(ev, data) {
  switch (ev) {
    case "normalize":
      markStep("normalize", "done", elapsed()); markStep("intent", "active"); break;
    case "link":
      markStep("intent", "done"); markStep("link", "done", elapsed()); markStep("route", "active"); break;
    case "route":
      markStep("route", "done", elapsed()); markStep("generate", "active"); break;
    case "generate":
      markStep("generate", "done", elapsed()); markStep("guard", "active"); break;
    case "static_check":
      markStep("guard", "done", elapsed()); markStep("execute", "active"); break;
    case "answer":
      markStep("guard", "done"); markStep("execute", "done", elapsed()); break;
    case "clarify":
      markStep("intent", "done"); markStep("link", "done");
      markStep("route", "warn", "되물음"); break;
    case "blocked":
      { const at = stepEl("generate").classList.contains("done") ? "guard" : "intent";
        markStep(at, "stop", "차단"); break; }
    case "escalate":
      markStep("generate", "active", `→ ${data.to}`); break;
    case "repair":
      markStep("execute", "active", `자가교정 ${data.attempts}회`); break;
    default: break;
  }
}

/* ---------- run --------------------------------------------------------- */
async function run() {
  const question = $("#q").value.trim();
  if (!question) { $("#q").focus(); return; }
  const btn = $("#run");
  btn.disabled = true; btn.classList.add("busy"); $("#runLbl").textContent = "실행 중";
  $("#out").innerHTML = "";
  $("#live").classList.remove("hidden");
  t0 = performance.now();
  resetSteps();

  try {
    const res = await fetch("/v1/query/stream", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ question, explain, max_rows: 100 }),
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const chunks = buf.split("\n\n");
      buf = chunks.pop();
      for (const chunk of chunks) {
        const ev = (chunk.match(/^event: (.*)$/m) || [])[1];
        const dataLine = (chunk.match(/^data: (.*)$/m) || [])[1];
        if (!ev || !dataLine) continue;
        const data = JSON.parse(dataLine);
        if (ev === "done") { setTimeout(() => $("#live").classList.add("hidden"), 260); render(data); }
        else if (ev === "error") {
          $("#live").classList.add("hidden");
          $("#out").appendChild(el("div", "panel panel-pad",
            `<div class="errbox"><b>오류</b><div class="msg">${esc(data.message)}</div></div>`));
        } else onStage(ev, data);
      }
    }
  } catch (e) {
    $("#live").classList.add("hidden");
    $("#out").appendChild(el("div", "panel panel-pad",
      `<div class="errbox"><b>요청 실패</b><div class="msg">${esc(e.message || e)}</div>
       <div class="msg" style="margin-top:6px;color:var(--muted)">서버가 떠 있는지 확인하세요 — <code>aegis serve</code></div></div>`));
  } finally {
    btn.disabled = false; btn.classList.remove("busy"); $("#runLbl").textContent = "실행";
  }
}

/* ---------- render ------------------------------------------------------ */
const STATUS_ICON = { ok: "●", clarify: "◆", blocked: "■", failed: "▲" };

function render(d) {
  const out = $("#out");

  /* verdict card */
  const head = el("div", "panel");
  const hrow = el("div", "verdict-head");
  hrow.appendChild(el("span", "badge b-" + d.status,
    `${STATUS_ICON[d.status] || "●"} ${esc(d.status.toUpperCase())}`));
  if (d.route) {
    hrow.appendChild(el("span", "badge b-tier",
      esc(d.route.tier) + (d.route.escalated_from ? ` ← ${esc(d.route.escalated_from)}` : "")));
  }
  const tid = el("span", "traceid", esc(d.trace_id));
  tid.title = "클릭하면 trace id 복사";
  tid.onclick = () => copy(d.trace_id, "trace id");
  hrow.appendChild(tid);
  head.appendChild(hrow);

  if (d.answer) head.appendChild(el("div", "answer", esc(d.answer)));

  const bits = [];
  if (d.route?.reason) bits.push("라우팅 " + esc(d.route.reason));
  if (d.linked_tables?.length) bits.push("테이블 " + d.linked_tables.map((t) => `<code>${esc(t)}</code>`).join(" "));
  if (d.glossary_terms?.length) bits.push("용어사전 " + d.glossary_terms.map((t) => `<code>${esc(t)}</code>`).join(" "));
  if (bits.length) head.appendChild(el("div", "reason", bits.join(" &nbsp;·&nbsp; ")));

  const k = el("div", "kpis");
  const kpi = (label, value, cls) => {
    const b = el("div", "kpi" + (cls ? " " + cls : ""));
    b.appendChild(el("div", "k", esc(label)));
    b.appendChild(el("div", "v", value));
    return b;
  };
  k.appendChild(kpi("지연", `${fmt(d.latency_ms)}<small>ms</small>`));
  k.appendChild(kpi("비용", d.cost_usd > 0 ? `$${d.cost_usd.toFixed(6)}` : "$0", d.cost_usd > 0 ? "" : "free"));
  if (d.route) k.appendChild(kpi("라우터 신뢰도", d.route.confidence.toFixed(2)));
  if (d.route) k.appendChild(kpi("난이도", d.route.difficulty.toFixed(2)));
  if (d.result) k.appendChild(kpi("결과", `${fmt(d.result.row_count)}<small>행</small>`));
  if (d.result) k.appendChild(kpi("DB 실행", `${fmt(d.result.elapsed_ms, 1)}<small>ms</small>`));
  head.appendChild(k);
  out.appendChild(head);

  /* governance */
  if (d.violations?.length || d.rewrites?.length) {
    const p = el("div", "panel panel-pad");
    p.appendChild(el("div", "panel-title", "거버넌스"));
    (d.violations || []).forEach((v) => {
      const warn = (v.severity || "").toLowerCase() !== "block";
      const box = el("div", "viol" + (warn ? " warn" : ""));
      box.innerHTML =
        `<span class="ico">${warn ? "▲" : "■"}</span><div><code>${esc(v.code)}</code> ` +
        `<span class="sub">${esc(v.severity)}${v.subject ? " · " + esc(v.subject) : ""}</span>` +
        `<div class="msg">${esc(v.message)}</div></div>`;
      p.appendChild(box);
    });
    if (d.rewrites?.length) {
      const r = el("div", "rewrites");
      r.appendChild(el("span", "sub", "<span style='font-size:12px;color:var(--muted)'>자동 재작성</span>"));
      d.rewrites.forEach((x) => r.appendChild(el("span", "tag", esc(x))));
      p.appendChild(r);
    }
    out.appendChild(p);
  }

  /* clarification */
  if (d.clarification) {
    const p = el("div", "panel panel-pad");
    p.appendChild(el("div", "panel-title", "되묻기 — 추측하지 않습니다"));
    p.appendChild(el("div", null, `<div style="font-size:15px">${esc(d.clarification.question || "")}</div>`));
    const opts = el("div", "opts");
    (d.clarification.options || []).forEach((o) => {
      const b = el("button", "opt", esc(o));
      b.onclick = () => { $("#q").value = $("#q").value.replace(/\s*\([^)]*기준\)$/, "") + ` (${o} 기준)`; run(); };
      opts.appendChild(b);
    });
    p.appendChild(opts);
    if (d.clarification.reasons?.length) {
      p.appendChild(el("div", "reasons", d.clarification.reasons.map((r) => "· " + esc(r)).join("<br/>")));
    }
    out.appendChild(p);
  }

  /* tabs — 항상 노출, 비어 있으면 비활성 */
  const specs = [
    { name: "결과", count: d.result ? d.result.row_count : 0, make: () => resultTable(d.result), on: !!d.result,
      why: "실행된 결과가 없습니다" },
    { name: "SQL", count: null, make: () => sqlPane(d), on: !!d.sql, why: "SQL이 생성되기 전에 종료되었습니다" },
    { name: "링킹 근거", count: d.evidence?.length || 0, make: () => evidencePane(d.evidence), on: !!d.evidence?.length,
      relight: !explain, why: "근거 표시가 꺼져 있습니다 — 클릭하면 켜고 다시 실행합니다" },
    { name: "트레이스", count: null, make: () => tracePane(d.trace), on: !!d.trace,
      relight: !explain, why: "근거 표시가 꺼져 있습니다 — 클릭하면 켜고 다시 실행합니다" },
    { name: "자가교정", count: d.repairs?.length || 0, make: () => repairPane(d.repairs), on: !!d.repairs?.length,
      why: "이 질의에서는 교정이 필요하지 않았습니다" },
  ];

  const p = el("div", "panel");
  const bar = el("div", "tabs");
  const body = el("div", "tabbody");
  let firstOn = specs.findIndex((s) => s.on);
  specs.forEach((s, i) => {
    const relight = !s.on && s.relight;
    const t = el("button", "tab" + (i === firstOn ? " active" : "") + (relight ? " relight" : ""),
      esc(s.name) + (s.count ? ` <span class="cnt">${fmt(s.count)}</span>` : "") +
      (relight ? ' <span class="cnt">켜기</span>' : ""));
    t.disabled = !s.on && !relight;
    if (!s.on) t.title = s.why;
    t.onclick = () => {
      if (relight) {  // 막다른 길을 만들지 않는다 — 켜고 같은 질문을 다시 실행
        setExplain(true);
        $("#q").value = d.question;
        run();
        return;
      }
      bar.querySelectorAll(".tab").forEach((x) => x.classList.remove("active"));
      t.classList.add("active");
      body.innerHTML = ""; body.appendChild(s.make());
    };
    bar.appendChild(t);
  });
  p.appendChild(bar);
  if (firstOn >= 0) body.appendChild(specs[firstOn].make());
  else body.appendChild(el("div", "empty", "<h3>표시할 산출물이 없습니다</h3><p>요청이 생성 전 단계에서 종료되었습니다.</p>"));
  p.appendChild(body);
  out.appendChild(p);
}

/* ---------- panes -------------------------------------------------------- */
function resultTable(r) {
  const box = el("div");
  // 숫자 컬럼 중 마지막 하나에 인라인 크기 막대를 붙인다 (단일 계열 magnitude).
  const numericCols = r.columns.map((_, i) => r.rows.every((row) => row[i] === null || typeof row[i] === "number"));
  const barCol = numericCols.lastIndexOf(true);
  const maxVal = barCol >= 0 ? Math.max(...r.rows.map((row) => Math.abs(Number(row[barCol]) || 0)), 0) : 0;

  const wrap = el("div", "tablewrap");
  const t = el("table");
  const trh = el("tr");
  r.columns.forEach((c, i) => trh.appendChild(el("th", numericCols[i] ? "num" : null, esc(c))));
  if (barCol >= 0 && maxVal > 0) trh.appendChild(el("th", null, ""));
  const thead = el("thead"); thead.appendChild(trh); t.appendChild(thead);

  const tb = el("tbody");
  r.rows.forEach((row) => {
    const tr = el("tr");
    row.forEach((v, i) => {
      const isNum = typeof v === "number";
      tr.appendChild(el("td", isNum ? "num" : null,
        v === null ? '<span class="nul">∅</span>' : esc(isNum ? v.toLocaleString(undefined, { maximumFractionDigits: 4 }) : v)));
    });
    if (barCol >= 0 && maxVal > 0) {
      const pct = Math.max(2, (Math.abs(Number(row[barCol]) || 0) / maxVal) * 100);
      tr.appendChild(el("td", "bar", `<div class="barbox"><i class="barfill" style="width:${pct.toFixed(1)}%"></i></div>`));
    }
    tb.appendChild(tr);
  });
  t.appendChild(tb); wrap.appendChild(t); box.appendChild(wrap);

  const foot = el("div", "tablefoot");
  foot.appendChild(el("span", null, `${fmt(r.row_count)}행 · DB ${fmt(r.elapsed_ms, 1)}ms${r.truncated ? " · 표시 상한" : ""}`));
  foot.appendChild(el("span", "spacer"));
  const cp = el("button", "copybtn", "CSV 복사");
  cp.onclick = () => copy([r.columns.join(","), ...r.rows.map((row) => row.join(","))].join("\n"), "CSV");
  foot.appendChild(cp);
  box.appendChild(foot);
  return box;
}

const SQL_KW = /\b(SELECT|FROM|WHERE|GROUP\s+BY|ORDER\s+BY|LIMIT|JOIN|LEFT|RIGHT|INNER|OUTER|ON|AS|AND|OR|NOT|IN|IS|NULL|COUNT|SUM|AVG|MIN|MAX|CAST|CASE|WHEN|THEN|ELSE|END|DISTINCT|BETWEEN|HAVING|WITH|OVER|PARTITION|substr|strftime|ROUND|NULLIF|REAL|DESC|ASC)\b/gi;
function highlight(sql) {
  return esc(sql)
    .replace(/('(?:[^']|'')*')/g, '<span class="s-str">$1</span>')
    .replace(SQL_KW, (m) => `<span class="s-kw">${m}</span>`)
    .replace(/\b(\d+(?:\.\d+)?)\b/g, '<span class="s-num">$1</span>');
}
function sqlPane(d) {
  const box = el("div");
  const mk = (label, sql, note) => {
    const h = el("div", "codehead");
    h.appendChild(el("span", "lbl", esc(label) + (note ? ` <span style="color:var(--accent-ink)">${esc(note)}</span>` : "")));
    h.appendChild(el("span", "spacer"));
    const cp = el("button", "copybtn", "복사");
    cp.onclick = () => copy(sql, "SQL");
    h.appendChild(cp);
    box.appendChild(h);
    box.appendChild(el("pre", null, highlight(sql)));
  };
  mk("생성된 SQL", d.sql || "");
  if (d.executed_sql && d.executed_sql !== d.sql) mk("실제 실행된 SQL", d.executed_sql, "거버넌스 재작성 적용됨");
  return box;
}

function evidencePane(ev) {
  const box = el("div");
  const max = Math.max(...ev.map((e) => e.score), 0.0001);
  ev.forEach((e) => {
    const row = el("div", "ev");
    row.innerHTML =
      `<span class="ref" title="${esc(e.ref)}">${esc(e.ref)}</span>` +
      `<span class="barbox"><i class="barfill" style="width:${((e.score / max) * 100).toFixed(1)}%"></i></span>` +
      `<span class="sc">${e.score.toFixed(3)}</span><span class="src">${esc(e.source)}</span>`;
    box.appendChild(row);
  });
  return box;
}

function flattenSpans(span, depth, list) {
  list.push({ span, depth });
  (span.children || []).forEach((c) => flattenSpans(c, depth + 1, list));
  return list;
}
function tracePane(root) {
  const box = el("div");
  const list = flattenSpans(root, 0, []);
  const total = root.duration_ms || 1;
  let acc = 0;
  list.forEach(({ span, depth }) => {
    const attrs = Object.entries(span.attributes || {})
      .filter(([, v]) => typeof v !== "object")
      .slice(0, 4).map(([k2, v]) => `${k2}=${v}`).join(" ");
    const left = depth === 0 ? 0 : Math.min(98, (acc / total) * 100);
    const width = Math.max(1.2, (span.duration_ms / total) * 100);
    if (depth > 0) acc += span.duration_ms;
    const row = el("div", "tr");
    row.innerHTML =
      `<span class="nm" style="padding-left:${depth * 13}px">${esc(span.name)}` +
      (attrs ? `<span class="at">${esc(attrs)}</span>` : "") + `</span>` +
      `<span class="gantt"><i style="left:${left.toFixed(1)}%;width:${width.toFixed(1)}%"></i></span>` +
      `<span class="ms">${span.duration_ms.toFixed(1)}ms</span>`;
    box.appendChild(row);
  });
  return box;
}

function repairPane(rs) {
  const box = el("div");
  rs.forEach((r) => {
    const c = el("div", "rep");
    c.innerHTML =
      `<div class="hd"><span style="color:${r.fixed ? "var(--good)" : "var(--critical)"}">${r.fixed ? "✓" : "✕"}</span>` +
      `<b>${esc(r.strategy)}</b><span style="color:var(--muted);font-size:12px">시도 ${r.attempt}</span></div>` +
      `<div class="err">${esc(r.error)}</div><pre>${highlight(r.after_sql || "")}</pre>`;
    box.appendChild(c);
  });
  return box;
}

/* ---------- wire -------------------------------------------------------- */
$("#run").onclick = run;
$("#q").addEventListener("keydown", (e) => { if (e.key === "Enter") run(); });
document.addEventListener("keydown", (e) => {
  if (e.key === "/" && document.activeElement !== $("#q")) { e.preventDefault(); $("#q").focus(); }
});
function setExplain(on) {
  explain = on;
  $("#explainBtn").setAttribute("aria-pressed", String(on));
  $("#explainState").textContent = on ? "켬" : "끔";
}
$("#explainBtn").onclick = () => setExplain(!explain);
renderExamples();
$("#out").appendChild(el("div", "panel empty",
  "<h3>질문을 입력하거나 위 예시를 눌러보세요</h3>" +
  "<p>조회는 SQL로, 개인정보 요청은 <b>SQL이 만들어지기 전에</b> 차단으로, 모호한 질문은 되묻기로 이어집니다.</p>"));
</script>
