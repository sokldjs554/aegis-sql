<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>AEGIS-SQL 콘솔</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%232a78d6'/><path d='M16 6l8 3.4v6.2c0 5-3.4 8.6-8 10.4-4.6-1.8-8-5.4-8-10.4V9.4z' fill='none' stroke='%23fff' stroke-width='2.2' stroke-linejoin='round'/><path d='M12.2 16.2l2.8 2.8 5-5.4' fill='none' stroke='%23fff' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/></svg>"/>
<style>
  /* ---------- tokens ---------------------------------------------------- */
  :root{
    color-scheme: light;
    --canvas:#f5f6f8; --surface:#ffffff; --surface-2:#fafbfc;
    --ink:#10131a; --ink-2:#3d4553; --muted:#5b6472;
    --line:#e3e7ee; --line-2:#eef1f6;
    --accent:#2a78d6; --accent-ink:#1c5cab; --accent-soft:#eaf2fd;
    --bar:#2a78d6; --bar-track:#e7eefb;
    --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
    --good-soft:#e8f6e8; --warning-soft:#fdf3dd; --critical-soft:#fbe9e9; --serious-soft:#fbeee7;
    --code-bg:#0f1420; --code-ink:#dbe3f4; --code-kw:#7fb2ff; --code-str:#8fd694;
    --code-num:#e5c07b; --code-cm:#7c879b;
    --shadow:0 1px 2px rgba(16,19,26,.05), 0 6px 20px rgba(16,19,26,.06);
    --radius:12px; --radius-sm:8px;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --canvas:#0c0f15; --surface:#141922; --surface-2:#181e28;
      --ink:#e7eaf0; --ink-2:#c2c9d6; --muted:#95a0b1;
      --line:#232b38; --line-2:#1c232e;
      --accent:#3987e5; --accent-ink:#7fb2ff; --accent-soft:#16243a;
      --bar:#3987e5; --bar-track:#1b2436;
      --good-soft:#122a16; --warning-soft:#2e2510; --critical-soft:#2f1618; --serious-soft:#2c1f16;
      --code-bg:#0a0e16; --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --canvas:#0c0f15; --surface:#141922; --surface-2:#181e28;
    --ink:#e7eaf0; --ink-2:#c2c9d6; --muted:#95a0b1;
    --line:#232b38; --line-2:#1c232e;
    --accent:#3987e5; --accent-ink:#7fb2ff; --accent-soft:#16243a;
    --bar:#3987e5; --bar-track:#1b2436;
    --good-soft:#122a16; --warning-soft:#2e2510; --critical-soft:#2f1618; --serious-soft:#2c1f16;
    --code-bg:#0a0e16; --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  }

  *{box-sizing:border-box}
  body{
    margin:0; background:var(--canvas); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    font-size:14px; line-height:1.62; -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--accent-soft)}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}
  .sr{position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden;
      clip:rect(0 0 0 0); white-space:nowrap; border:0}

  /* ---------- app bar ----------------------------------------------------
     헤더는 세 가지만 한다: 여기가 어디인가(브랜드) · 어디로 갈 수 있는가(탭)
     · 지금 정상인가(점 하나).  엔진이 무엇을 할 수 있는지를 칩으로 나열하면
     그건 대시보드가 아니라 기동 로그다 — 그 정보는 엔진 정보 서랍에 있다. */
  .appbar{position:sticky; top:0; z-index:30; background:var(--surface); border-bottom:1px solid var(--line)}
  .appbar-in{max-width:1240px; margin:0 auto; padding:0 24px; height:56px;
             display:flex; align-items:center; gap:10px}
  .brand{display:flex; align-items:center; gap:8px; font-size:15px; font-weight:700;
         letter-spacing:-.3px; color:var(--ink); flex:none}
  .brand span{color:var(--accent)}
  .brand svg{display:block; flex:none}
  .appbar .spacer{flex:1}

  /* 모드 전환을 헤더 밑줄 탭으로 편입 — 본문에서 한 줄을 회수하고,
     채도 높은 파랑이 [실행] 버튼 하나로 줄어든다. */
  .navtabs{display:flex; gap:2px; margin-left:10px; align-self:stretch}
  .navtab{position:relative; padding:0 12px; border:0; background:none; font-family:inherit;
          font-size:13px; color:var(--muted); cursor:pointer; display:flex; align-items:center}
  .navtab::after{content:""; position:absolute; left:12px; right:12px; bottom:-1px; height:2px;
                 background:transparent}
  .navtab:hover{color:var(--ink-2)}
  .navtab[aria-selected="true"]{color:var(--ink); font-weight:600}
  .navtab[aria-selected="true"]::after{background:var(--accent)}

  /* 헤더 우측은 '버튼 3개'가 아니라 '텍스트 3개'로 읽혀야 한다.  다만 완전히
     투명하면 누를 수 있다는 것 자체가 안 읽힌다 — 실제로 데모 중에 '이거 클릭이
     안 되는데요' 라는 보고를 받았다.  누를 수 있다는 최소 신호만 남긴다:
     아주 옅은 상시 테두리 + 무언가를 여는 버튼에는 ▾ 캐럿. */
  .ghostbtn{display:inline-flex; align-items:center; gap:7px; height:30px; padding:0 11px;
            border-radius:7px; border:1px solid var(--line-2); background:none; color:var(--muted);
            font-size:12.5px; font-family:inherit; cursor:pointer; white-space:nowrap}
  .ghostbtn:hover{background:var(--surface-2); border-color:var(--line); color:var(--ink-2)}
  .ghostbtn:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  .ghostbtn .car{font-size:9px; color:var(--muted); opacity:.75; margin-left:-2px}
  .ghostbtn .num{font-size:11.5px; color:var(--muted); font-variant-numeric:tabular-nums}
  /* 결과 뷰 — 표/차트 2단 토글, 큰 숫자 타일, 막대·추이 차트 */
  .viewtog{display:inline-flex; border:1px solid var(--line); border-radius:7px; overflow:hidden}
  .viewtog button{border:0; background:var(--surface); color:var(--muted); font-family:inherit;
                  font-size:11.5px; padding:3px 11px; cursor:pointer}
  .viewtog button[aria-pressed="true"]{background:var(--surface-2); color:var(--ink); font-weight:600}
  .bignum{padding:26px 4px 22px; text-align:center}
  .bignum .v{font-family:var(--mono); font-size:40px; font-weight:600; color:var(--ink);
             line-height:1.1; font-variant-numeric:tabular-nums}
  .bignum .k{margin-top:8px; font-size:12.5px; color:var(--muted)}
  .chartbox{padding:14px 4px 6px}
  .cbar{display:grid; grid-template-columns:minmax(72px,26%) 1fr auto; gap:8px; align-items:center;
        padding:3px 0; font-size:12.5px}
  .cbar .cl{color:var(--ink-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .cbar .cv{font-family:var(--mono); font-size:12px; color:var(--ink); text-align:right;
            font-variant-numeric:tabular-nums; white-space:nowrap}
  .chartnote{margin-top:10px; font-size:11.5px; color:var(--muted)}
  .lock{margin-left:5px; font-size:9.5px; color:var(--muted); font-weight:400}
  /* 행 정책 대조 */
  .cmp{margin-top:10px; border-top:1px dashed var(--line); padding-top:10px}
  .cmpgrid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:9px}
  @media (max-width:700px){ .cmpgrid{grid-template-columns:1fr} }
  .cmpcell{border:1px solid var(--line); border-radius:var(--radius-sm); padding:9px 11px; background:var(--surface-2)}
  .cmpcell .ch{font-size:11.5px; color:var(--muted); margin-bottom:5px}
  .cmpcell .cn{font-family:var(--mono); font-size:16px; color:var(--ink); font-variant-numeric:tabular-nums}
  .cmpcell .cr{margin-top:6px; font-size:11.5px; color:var(--ink-2); line-height:1.7}
  .cmpcell .cr span{font-family:var(--mono)}
  /* 예시 그룹 선택 pill */
  .expills{display:flex; gap:5px; flex-wrap:wrap; margin-bottom:6px}
  .expill{border:1px solid var(--line); background:var(--surface); color:var(--muted);
          border-radius:999px; padding:3px 11px; font-size:11.5px; font-family:inherit; cursor:pointer}
  .expill[aria-pressed="true"]{background:var(--surface-2); color:var(--ink); border-color:var(--ink-2); font-weight:600}
  .expill .n{color:var(--muted); font-size:10.5px; margin-left:4px; font-variant-numeric:tabular-nums}
  .expill[aria-pressed="true"] .n{color:var(--ink-2)}
  .copybtn{padding:3px 10px; border-radius:6px; border:1px solid var(--line); background:var(--surface);
           color:var(--muted); font-size:11.5px; font-family:inherit; cursor:pointer; white-space:nowrap}
  .copybtn:hover{border-color:var(--accent); color:var(--accent)}
  .ghostbtn .fp{font-family:var(--mono); font-size:11px; color:var(--muted)}
  .dot{width:7px; height:7px; border-radius:50%; background:var(--good); flex:none}
  .dot.bad{background:var(--critical)}
  @media (max-width:620px){ .ghostbtn .fp, .ghostbtn .lbl{display:none} }

  main{max-width:1240px; margin:0 auto; padding:26px 22px 60px}

  /* ---------- ask ------------------------------------------------------- */
  .askwrap{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
           padding:16px 18px 14px; box-shadow:var(--shadow); margin-bottom:14px}
  .askrow{display:flex; gap:9px; align-items:stretch}
  .field{position:relative; flex:1; display:flex; align-items:center}
  .field .mag{position:absolute; left:13px; color:var(--muted); font-size:14px; pointer-events:none}
  input[type=text], textarea, select{
    width:100%; border:1px solid var(--line); border-radius:var(--radius-sm);
    background:var(--surface-2); color:var(--ink); font-family:inherit; outline:none;
    transition:border-color .12s, box-shadow .12s;
  }
  input[type=text]{padding:13px 15px 13px 36px; font-size:14.5px}
  textarea{padding:12px 14px; font-family:var(--mono); font-size:12.8px; line-height:1.6;
           resize:vertical; min-height:118px}
  select{padding:5px 8px; font-size:12.5px; width:auto}
  input[type=text]:focus, textarea:focus, select:focus{
    border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
  .btn{padding:0 22px; border:0; border-radius:var(--radius-sm); background:var(--accent); color:#fff;
       font-weight:600; font-size:14px; font-family:inherit; cursor:pointer; white-space:nowrap;
       display:inline-flex; align-items:center; justify-content:center; gap:8px}
  .btn.sm{padding:8px 14px; font-size:13px}
  .btn:hover:not(:disabled){filter:brightness(1.06)}
  .btn:disabled{opacity:.6; cursor:progress}
  .btn .spin{width:13px; height:13px; border:2px solid rgba(255,255,255,.35); border-top-color:#fff;
             border-radius:50%; animation:spin .7s linear infinite; display:none}
  .btn.busy .spin{display:inline-block}
  @keyframes spin{to{transform:rotate(360deg)}}

  .askmeta{display:flex; align-items:center; gap:12px; margin-top:11px; flex-wrap:wrap}
  .switch{display:inline-flex; align-items:center; gap:8px; cursor:pointer; font-size:12.5px;
          color:var(--muted); border:1px solid var(--line); border-radius:999px;
          padding:5px 11px 5px 8px; background:var(--surface-2); font-family:inherit}
  .switch .track{width:30px; height:17px; border-radius:999px; background:var(--line);
                 position:relative; flex:none}
  .switch .knob{position:absolute; top:2px; left:2px; width:13px; height:13px; border-radius:50%;
                background:var(--surface); box-shadow:0 1px 2px rgba(0,0,0,.3); transition:transform .15s}
  .switch[aria-pressed="true"]{color:var(--accent-ink); border-color:var(--accent)}
  .switch[aria-pressed="true"] .track{background:var(--accent)}
  .switch[aria-pressed="true"] .knob{transform:translateX(13px)}
  .ctx{display:inline-flex; align-items:center; gap:6px; font-size:12.5px; color:var(--muted);
       border:1px solid var(--line); border-radius:999px; padding:3px 10px; background:var(--surface-2)}
  .kbd{font-family:var(--mono); font-size:11px; border:1px solid var(--line); border-bottom-width:2px;
       border-radius:5px; padding:1px 5px; color:var(--muted); background:var(--surface-2)}
  .hint{font-size:12.5px; color:var(--muted)}

  /* ---------- examples & history ---------------------------------------- */
  .exgroups{display:flex; flex-wrap:wrap; gap:8px 20px; margin:0 0 14px}
  .exgroup{display:flex; align-items:center; gap:7px; flex-wrap:wrap}
  /* 좁은 화면에서는 칩이 줄바꿈으로 쌓이는 대신 가로로 흐르게 둔다 —
     예시·이력이 결과를 화면 밖으로 밀어내지 않도록. */
  @media (max-width:720px){
    .exgroup{flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none}
    .exgroup::-webkit-scrollbar{display:none}
    .exlabel{flex:0 0 auto}
    .chip{max-width:none; flex:0 0 auto}
  }
  .exlabel{font-size:11px; font-weight:700; letter-spacing:.4px; color:var(--muted)}
  .chip{padding:5px 12px; border:1px solid var(--line); border-radius:999px; background:var(--surface);
        color:var(--ink-2); cursor:pointer; font-size:12.5px; font-family:inherit;
        max-width:330px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .chip:hover{border-color:var(--accent); color:var(--accent-ink); background:var(--accent-soft)}
  /* 종류는 테두리가 아니라 선행 글리프로 — 파선 컬러 테두리는 검증 오류 UI 의
     문법이라 '경고가 떠 있는 화면'으로 읽힌다. 글리프는 결과 배지와 같은 기호다. */
  .chip .g{font-size:9px; margin-right:6px; vertical-align:1px}
  .chip.ok  .g{color:var(--good)}
  .chip.gov .g{color:var(--critical)}
  .chip.amb .g{color:var(--warning)}
  .chip.hist{font-family:var(--mono); font-size:11.5px}

  /* ---------- panels ---------------------------------------------------- */
  .panel{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
         box-shadow:var(--shadow); margin-bottom:14px; overflow:hidden}
  .panel-pad{padding:16px 18px}
  .panel-title{font-size:12px; font-weight:700; letter-spacing:.5px; color:var(--muted); margin-bottom:10px}

  /* ---------- stepper --------------------------------------------------- */
  .steps{display:flex; flex-wrap:wrap; padding:13px 18px}
  .step{display:flex; align-items:center; gap:8px; padding-right:10px; opacity:.4}
  .step .dot{width:20px; height:20px; border-radius:50%; border:2px solid var(--line); flex:none;
             display:grid; place-items:center; font-size:10px; color:var(--muted); background:var(--surface)}
  .step .nm{font-size:12.5px; color:var(--ink-2); white-space:nowrap}
  .step .ms{font-family:var(--mono); font-size:11px; color:var(--muted)}
  .step .sep{width:16px; height:1px; background:var(--line); margin-left:2px}
  .step.done,.step.active,.step.stop,.step.warn,.step.skip{opacity:1}
  .step.done .dot{border-color:var(--good); color:var(--good)}
  .step.active .dot{border-color:var(--accent); color:var(--accent); animation:pulse 1.1s ease-in-out infinite}
  .step.stop .dot{border-color:var(--critical); color:var(--critical)}
  .step.warn .dot{border-color:var(--warning); color:var(--warning)}
  .step.skip{opacity:.5}
  .step.skip .dot{border-style:dashed}
  .step.skip .nm{text-decoration:line-through}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 var(--accent-soft)}50%{box-shadow:0 0 0 5px var(--accent-soft)}}
  @media (prefers-reduced-motion: reduce){ .step.active .dot{animation:none} .btn .spin{animation-duration:2s} }

  /* ---------- verdict --------------------------------------------------- */
  .verdict-head{display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:15px 18px 0}
  .badge{padding:3px 11px; border-radius:999px; font-size:11.5px; font-weight:700;
         display:inline-flex; align-items:center; gap:5px}
  .b-ok{background:var(--good-soft); color:var(--good)}
  .b-clarify{background:var(--warning-soft); color:#8a6a10}
  .b-blocked,.b-failed{background:var(--critical-soft); color:var(--critical)}
  :root[data-theme="dark"] .b-clarify{color:var(--warning)}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .b-clarify{color:var(--warning)} }
  .b-tier{background:var(--accent-soft); color:var(--accent-ink); font-family:var(--mono)}
  .b-ctx{background:var(--serious-soft); color:var(--serious); font-family:var(--mono)}
  .traceid{margin-left:auto; font-family:var(--mono); font-size:11.5px; color:var(--ink-2);
           cursor:pointer; border:1px solid transparent; padding:2px 7px; border-radius:6px; background:none}
  .traceid:hover{border-color:var(--line); background:var(--surface-2)}
  .traceid .tl{font-family:inherit; color:var(--muted)}
  .traceid .cg{opacity:.45}
  .routewhy{padding:0 18px 13px; font-size:12.3px; color:var(--muted)}
  .routewhy summary{cursor:pointer; color:var(--muted); list-style:none; display:inline-flex;
                    align-items:center; gap:5px}
  .routewhy summary::-webkit-details-marker{display:none}
  .routewhy summary::before{content:"▸"; font-size:10px; transition:transform .15s}
  .routewhy[open] summary::before{transform:rotate(90deg)}
  .routewhy > div{margin-top:7px; line-height:1.6; color:var(--ink-2)}
  .answer{font-size:15.5px; line-height:1.72; padding:12px 18px 4px}
  .reason{padding:0 18px 13px; font-size:12.5px; color:var(--muted)}
  .reason code{font-family:var(--mono); font-size:11.5px; background:var(--surface-2);
               border:1px solid var(--line-2); border-radius:4px; padding:1px 5px; color:var(--ink-2)}
  .kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(136px,1fr)); gap:1px;
        background:var(--line); border-top:1px solid var(--line)}
  .kpi{background:var(--surface-2); padding:11px 16px}
  .kpi .k{font-size:10.5px; font-weight:700; letter-spacing:.4px; color:var(--muted)}
  .kpi .v{font-family:var(--mono); font-size:17px; font-weight:600; margin-top:2px;
          font-variant-numeric:tabular-nums}
  .kpi .v small{font-size:11.5px; color:var(--muted); font-weight:400; margin-left:2px}
  .kpi.free .v{color:var(--good)}
  .fb{display:flex; align-items:center; gap:8px; padding:11px 18px; border-top:1px solid var(--line);
      background:var(--surface-2); font-size:12.5px; color:var(--muted); flex-wrap:wrap}
  .fb button{font-size:12.5px; padding:5px 12px; border-radius:999px; border:1px solid var(--line);
             background:var(--surface); color:var(--ink-2); cursor:pointer; font-family:inherit}
  .fb button:hover{border-color:var(--accent); color:var(--accent-ink)}
  .fb .done{color:var(--good)}

  /* ---------- governance / clarify -------------------------------------- */
  .viol{display:flex; gap:10px; padding:11px 13px; border-radius:var(--radius-sm); margin-bottom:8px;
        background:var(--critical-soft); border:1px solid color-mix(in srgb, var(--critical) 26%, transparent)}
  .viol code{font-family:var(--mono); font-weight:700; font-size:12px; color:var(--critical)}
  .viol .sub{font-family:var(--mono); font-size:11.5px; color:var(--muted)}
  .viol .msg{margin-top:3px; font-size:13.2px; color:var(--ink-2)}
  .viol.warn{background:var(--warning-soft); border-color:color-mix(in srgb, var(--warning) 40%, transparent)}
  .viol.warn code{color:#8a6a10}
  .rewrites{display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; align-items:center}
  .tag{font-family:var(--mono); font-size:11px; padding:3px 8px; border-radius:6px;
       background:var(--accent-soft); color:var(--accent-ink)}
  .opts{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px}
  .opt{padding:8px 15px; border:1px solid var(--accent); color:var(--accent-ink); background:var(--surface);
       border-radius:999px; cursor:pointer; font-size:13px; font-family:inherit}
  .opt:hover{background:var(--accent); color:#fff}
  .reasons{margin-top:9px; font-size:12.5px; color:var(--muted)}

  /* ---------- tabs ------------------------------------------------------ */
  .tabs{display:flex; gap:2px; border-bottom:1px solid var(--line); padding:0 10px;
        overflow-x:auto; background:var(--surface-2)}
  .tab{padding:11px 14px; cursor:pointer; color:var(--muted); border:0; border-bottom:2px solid transparent;
       font-size:13px; white-space:nowrap; background:none; font-family:inherit;
       display:flex; align-items:center; gap:6px}
  .tab:hover{color:var(--ink-2)}
  .tab[aria-selected="true"]{color:var(--accent-ink); border-bottom-color:var(--accent); font-weight:600}
  .tab[data-empty="true"]{opacity:.5}
  .tab[data-empty="true"] .cnt{display:none}
  .tab .cnt{font-family:var(--mono); font-size:10.5px; padding:1px 5px; border-radius:5px;
            background:var(--line-2); color:var(--muted)}
  .tab[aria-selected="true"] .cnt{background:var(--accent-soft); color:var(--accent-ink)}
  .tabbody{padding:16px 18px}
  .hidden{display:none !important}
  .whybox{display:flex; gap:11px; padding:14px 16px; border-radius:var(--radius-sm);
          background:var(--surface-2); border:1px solid var(--line)}
  .whybox b{display:block; margin-bottom:3px}
  .whybox .sub{font-size:12.8px; color:var(--muted)}

  /* ---------- table ----------------------------------------------------- */
  .tablewrap{overflow:auto; max-height:440px; border:1px solid var(--line); border-radius:var(--radius-sm)}
  table{border-collapse:separate; border-spacing:0; width:100%; font-size:13px}
  thead th{position:sticky; top:0; z-index:2; background:var(--surface-2); color:var(--muted);
           font-weight:700; font-size:11px; letter-spacing:.4px; padding:9px 12px; text-align:left;
           border-bottom:1px solid var(--line); white-space:nowrap}
  thead th.num{text-align:right}
  tbody td{padding:8px 12px; border-bottom:1px solid var(--line-2); white-space:nowrap; color:var(--ink-2)}
  tbody tr:nth-child(even) td{background:color-mix(in srgb, var(--surface-2) 55%, transparent)}
  tbody tr:hover td{background:var(--accent-soft)}
  td.num{text-align:right; font-family:var(--mono); font-variant-numeric:tabular-nums; color:var(--ink)}
  td.bar{padding:0 12px; width:118px}
  .barbox{height:7px; border-radius:4px; background:var(--bar-track); overflow:hidden}
  .barfill{display:block; height:100%; border-radius:4px; background:var(--bar)}
  .nul{color:var(--muted); font-family:var(--mono)}
  .tablefoot{display:flex; align-items:center; gap:12px; margin-top:9px; font-size:12px;
             color:var(--muted); font-family:var(--mono)}
  .tablefoot .spacer{flex:1}

  /* ---------- code ------------------------------------------------------ */
  .codehead{display:flex; align-items:center; gap:10px; margin-bottom:7px}
  .codehead .lbl{font-size:12px; color:var(--muted)}
  .codehead .spacer{flex:1}
  pre{margin:0 0 12px; background:var(--code-bg); color:var(--code-ink); padding:14px 16px;
      border-radius:var(--radius-sm); overflow-x:auto; font-family:var(--mono);
      font-size:12.5px; line-height:1.6}
  .s-kw{color:var(--code-kw); font-weight:600} .s-str{color:var(--code-str)}
  .s-num{color:var(--code-num)} .s-cm{color:var(--code-cm); font-style:italic}
  .copybtn{font-size:11.5px; padding:4px 10px; border-radius:6px; border:1px solid var(--line);
           background:var(--surface); color:var(--muted); cursor:pointer; font-family:inherit}
  .copybtn:hover{border-color:var(--accent); color:var(--accent)}

  /* ---------- evidence & trace ------------------------------------------ */
  .ev{display:grid; grid-template-columns:180px 1fr 56px 84px; gap:10px; align-items:center;
      padding:7px 0; border-bottom:1px dotted var(--line)}
  .ev:last-child{border-bottom:0}
  .ev .ref{font-family:var(--mono); font-size:12px; overflow:hidden; text-overflow:ellipsis}
  .ev .sc{font-family:var(--mono); font-size:12px; color:var(--accent-ink); text-align:right}
  .ev .src{font-size:11px; color:var(--muted); text-align:right; font-family:var(--mono)}
  .tr{display:grid; grid-template-columns:1fr 230px 62px; gap:10px; align-items:center;
      padding:5px 0; border-bottom:1px dotted var(--line-2); font-size:12.5px}
  .tr:last-child{border-bottom:0}
  .tr .nm{font-family:var(--mono); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .tr .nm .at{color:var(--muted); font-size:11px; margin-left:7px}
  .tr .ms{font-family:var(--mono); color:var(--muted); text-align:right; font-variant-numeric:tabular-nums}
  .gantt{height:9px; background:var(--bar-track); border-radius:4px; position:relative}
  .gantt i{position:absolute; top:0; bottom:0; background:var(--bar); border-radius:4px; min-width:2px}

  /* ---------- schema drawer --------------------------------------------- */
  .scrim{position:fixed; inset:0; background:rgba(8,11,16,.5); z-index:40; display:flex; justify-content:flex-end}
  .drawer{position:relative; width:min(780px,96vw); background:var(--surface); height:100%;
          overflow:auto; border-left:1px solid var(--line); padding:20px 22px 40px}
  .drawer h2{margin:0 0 4px; font-size:17px}
  .drawer .close{position:absolute; top:16px; right:20px}
  /* 서랍에 형제 탭을 붙인다 — 새 오버레이를 또 만들면 스크림·Esc·포커스·모바일
     대응이 두 벌이 되고, 무엇보다 팝오버는 스크린샷에 안 잡힌다. */
  .dtabs{display:flex; gap:2px; margin:14px 0 16px; border-bottom:1px solid var(--line)}
  .dtab{padding:9px 14px; border:0; border-bottom:2px solid transparent; background:none;
        font-family:inherit; font-size:13px; color:var(--muted); cursor:pointer}
  .dtab[aria-selected="true"]{color:var(--ink); font-weight:600; border-bottom-color:var(--accent)}
  .srow{display:grid; grid-template-columns:136px 1fr auto; gap:10px; align-items:baseline;
        padding:9px 0; border-top:1px solid var(--line-2); font-size:12.8px}
  .srow:first-of-type{border-top:0}
  .srow dt{color:var(--muted); margin:0}
  .srow dd{margin:0; color:var(--ink-2); overflow-wrap:anywhere}
  .srow .mono{font-family:var(--mono); font-size:11.5px}
  .srow .off{color:var(--muted)}
  .criterion{background:var(--surface-2); border:1px solid var(--line); border-radius:var(--radius-sm);
             padding:13px 15px; font-size:12.8px; line-height:1.65; color:var(--ink-2); margin-bottom:16px}
  .dlinks{display:flex; gap:14px; flex-wrap:wrap; margin-top:18px; padding-top:14px;
          border-top:1px solid var(--line); font-size:12px}
  .dlinks a{color:var(--muted)}
  /* 응답별 재현 스트립 — 지문·프롬프트는 페이지의 각주가 아니라 그 응답의 속성이다 */
  .prov{border:1px solid var(--line); border-radius:var(--radius-sm); background:var(--surface-2);
        padding:12px 14px; margin-bottom:14px}
  .prov .ph{font-size:11px; font-weight:700; letter-spacing:.4px; color:var(--muted); margin-bottom:9px}
  .prov .pr{display:grid; grid-template-columns:104px 1fr; gap:9px; padding:3px 0; font-size:12.3px}
  .prov .pk{color:var(--muted)}
  .prov .pv{color:var(--ink-2); font-family:var(--mono); font-size:11.5px; overflow-wrap:anywhere}
  .legend{display:flex; gap:14px; flex-wrap:wrap; margin:12px 0; font-size:11.5px; color:var(--muted)}
  .tbl-card{border:1px solid var(--line); border-radius:var(--radius-sm); margin-bottom:9px; overflow:hidden}
  .tbl-head{display:flex; align-items:center; gap:9px; padding:9px 12px; background:var(--surface-2);
            cursor:pointer; font-family:var(--mono); font-size:12.5px; width:100%; border:0;
            text-align:left; color:var(--ink)}
  .tbl-head .cm{font-family:inherit; color:var(--muted); font-size:12px}
  .tbl-head .rows{margin-left:auto; color:var(--muted); font-size:11.5px}
  .col{display:grid; grid-template-columns:190px 84px 1fr 92px; gap:9px; padding:5px 12px;
       font-size:12px; border-top:1px solid var(--line-2); align-items:center}
  .col .cn{font-family:var(--mono)} .col .ct{font-family:var(--mono); color:var(--muted); font-size:11px}
  .col .cc{color:var(--muted); overflow:hidden; text-overflow:ellipsis}
  .sens{font-family:var(--mono); font-size:10.5px; padding:1px 7px; border-radius:5px; justify-self:end}
  .sens.public{background:var(--line-2); color:var(--muted)}
  .sens.internal{background:var(--accent-soft); color:var(--accent-ink)}
  .sens.masked{background:var(--warning-soft); color:#8a6a10}
  .sens.forbidden{background:var(--critical-soft); color:var(--critical); font-weight:700}

  /* ---------- misc ------------------------------------------------------ */
  .rep{border:1px solid var(--line); border-radius:var(--radius-sm); padding:11px 13px; margin-bottom:9px}
  .rep .hd{display:flex; align-items:center; gap:8px; font-size:13px}
  .rep .err{font-family:var(--mono); font-size:11.5px; color:var(--muted); margin:4px 0 7px}
  .empty{text-align:center; padding:40px 20px; color:var(--muted)}
  .empty h3{margin:0 0 6px; font-size:15px; color:var(--ink-2)}
  .empty p{margin:0; font-size:13px}
  /* 첫 화면 — 카드도 일러스트도 없이, 이 엔진이 끝나는 세 가지 방식만 선언한다.
     글리프와 색은 결과 배지와 같은 것을 써서 화면이 자기 어휘를 먼저 가르친다. */
  .intro{padding:46px 20px 40px}
  .intro .lead{margin:0 auto; max-width:640px; font-size:16px; line-height:1.65; color:var(--ink-2);
               text-align:center}
  .outcomes{display:grid; grid-template-columns:repeat(3,1fr); gap:0; margin:30px auto 0;
            max-width:840px; border-top:1px solid var(--line-2); padding-top:24px}
  .outcome{padding:0 20px; text-align:left; border-left:1px solid var(--line-2)}
  .outcome:first-child{border-left:0}
  .outcome .hd{display:flex; align-items:center; gap:7px; font-size:13.5px; font-weight:700;
               color:var(--ink); margin-bottom:5px}
  .outcome .g{font-size:10px}
  .outcome .g.ok{color:var(--good)}
  .outcome .g.gov{color:var(--critical)}
  .outcome .g.amb{color:var(--warning)}
  .outcome p{font-size:12.8px; line-height:1.6; color:var(--muted); text-align:left}
  .honest{max-width:840px; margin:26px auto 0; padding-top:18px; border-top:1px solid var(--line-2);
          font-size:12.3px; line-height:1.6; color:var(--muted); text-align:center}
  @media (max-width:720px){
    .outcomes{grid-template-columns:1fr; gap:20px; max-width:420px}
    .outcome{border-left:0; padding:0}
    .outcome + .outcome{border-top:1px solid var(--line-2); padding-top:18px}
  }
  .errbox{border-left:3px solid var(--critical); background:var(--critical-soft); padding:12px 15px;
          border-radius:0 var(--radius-sm) var(--radius-sm) 0}
  .toast{position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(12px); opacity:0;
         background:var(--ink); color:var(--canvas); padding:9px 16px; border-radius:999px;
         font-size:12.5px; pointer-events:none; transition:.18s; z-index:50}
  .toast.show{opacity:1; transform:translateX(-50%)}
  /* 본문 폭을 가로지르는 mono 텍스트 줄은 그 자체로 '개발자 콘솔' 신호다.
     한 줄, 본문 글꼴, 양끝 정렬. 링크는 남긴다 — 서비스가 실제로 떠 있다는
     유일한 클릭 가능한 증거이고, 해시 문자열과 달리 시각적 소음이 아니다. */
  footer{display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-top:44px; padding-top:16px;
         border-top:1px solid var(--line-2); color:var(--muted); font-size:11.5px}
  footer .sp{flex:1}
  footer a{color:var(--muted); text-decoration:none; border-bottom:1px solid var(--line)}
  footer a:hover{color:var(--accent); border-bottom-color:var(--accent)}
  footer .fp{font-family:var(--mono)}
  footer .linkish{background:none; border:0; padding:0; font:inherit; color:var(--muted);
                  cursor:pointer; border-bottom:1px solid var(--line)}
  footer .linkish:hover{color:var(--accent); border-bottom-color:var(--accent)}
</style>
</head>

<script>

   /v1/policy 가 선언한 것을 그대로 채운다 — 정책을 고치면 UI가 따라온다. */
async function loadPolicy() {
  try { policyCache = await (await fetch("/v1/policy")).json(); }
  catch (e) { return; }
  (policyCache.row_policies || []).forEach((rp) => {
    const sel = rp.context_key === "branch_cd" ? $("#ctxBranch")
              : rp.context_key === "purpose" ? $("#ctxPurpose") : null;

    // 정책이 선언한 값만 남긴다 (첫 옵션 = '해당 없음'은 유지)

function schemaPane(g) {

  pane.appendChild(el("div", "legend",
    Object.keys(SENS_KO).map((k) =>
      `<span><span class="sens ${k}">${SENS_KO[k]}</span> ${counts[k] || 0}개 컬럼</span>`).join("")));

  g.tables.forEach((t) => {

    head.setAttribute("aria-expanded", "false");

        `${c.code_group ? ` · 코드 ${esc(c.code_group)}` : ""}</span>` +
        `<span class="sens ${esc(sv)}">${esc(SENS_KO[sv] || sv)}</span>`));
    });
    head.onclick = () => head.setAttribute("aria-expanded", String(body.classList.toggle("hidden") === false));
    card.appendChild(head); card.appendChild(body); pane.appendChild(card);
  });
  return pane;
}

async function openInfo(tab) {
  if (!schemaCache) {
    try { schemaCache = await (await fetch("/v1/schema")).json(); }
    catch (e) { toast("엔진 정보를 불러오지 못했습니다"); return; }
  }
  const g = schemaCache;
  const opener = document.activeElement;

  const scrim = el("div", "scrim");
  const d = el("div", "drawer");
  d.setAttribute("role", "dialog"); d.setAttribute("aria-modal", "true"); d.setAttribute("aria-label", "엔진 정보");
  d.innerHTML = `<button class="ghostbtn close" id="schemaClose">닫기 ✕</button><h2>엔진 정보</h2>`;

  const bar = el("div", "dtabs");
  bar.setAttribute("role", "tablist");
  const body = el("div");
  const PANES = [
    { name: "스키마 사전", make: () => schemaPane(g) },
    { name: "런타임 · 재현", make: () => runtimePane(g) },
  ];
  const show = (i) => {
    [...bar.children].forEach((x, j) => x.setAttribute("aria-selected", String(i === j)));
    body.innerHTML = "";
    body.appendChild(PANES[i].make());
  };
  PANES.forEach((pane, i) => {
    const t = el("button", "dtab", esc(pane.name));
    t.setAttribute("role", "tab");
    t.onclick = () => show(i);
    bar.appendChild(t);
  });
  d.appendChild(bar); d.appendChild(body);
  scrim.appendChild(d);

  const close = () => {
    scrim.remove();
    document.removeEventListener("keydown", onKey);
    if (opener && opener.focus) opener.focus();
  };
  const onKey = (e) => { if (e.key === "Escape") close(); };
  scrim.onclick = (e) => { if (e.target === scrim) close(); };
  document.addEventListener("keydown", onKey);
  document.body.appendChild(scrim);
  d.querySelector("#schemaClose").onclick = close;
  show(tab === "runtime" ? 1 : 0);
  d.querySelector("#schemaClose").focus();
}

/* ---------- stepper ------------------------------------------------------ */
function resetSteps() {
  const box = $("#steps");
  box.innerHTML = "";
  STEPS.forEach((s, i) => {
    const d = el("div", "step");
    d.dataset.id = s.id;
    d.innerHTML = `<span class="dot">${i + 1}</span><span class="nm">${esc(s.label)}</span>` +
                  `<span class="ms"></span>` + (i < STEPS.length - 1 ? `<span class="sep"></span>` : "");
    box.appendChild(d);
  });
  markStep("normalize", "active");
}
const stepEl = (id) => $(`.step[data-id="${id}"]`);
function markStep(id, cls, note) {
  const s = stepEl(id);
  if (!s) return;
  s.classList.remove("active", "done", "stop", "warn", "skip");
  s.classList.add(cls);
  const i = STEPS.findIndex((x) => x.id === id) + 1;
  s.querySelector(".dot").textContent =
    cls === "done" ? "✓" : cls === "stop" ? "✕" : cls === "warn" ? "?" : cls === "skip" ? "–" : i;
  if (note !== undefined) s.querySelector(".ms").textContent = note;
}
/** 종료된 경로의 남은 단계는 유령으로 두지 않고 '생략'으로 표시한다. */
function skipFrom(id, note) {
  const from = STEPS.findIndex((s) => s.id === id);
  for (let k = from; k < STEPS.length; k++) {
    const e = stepEl(STEPS[k].id);
    if (e && !e.classList.contains("stop")) markStep(STEPS[k].id, "skip", k === from ? note : "");
  }
}
const elapsed = () => `${Math.round(performance.now() - t0)}ms`;

function onStage(ev, data) {
  switch (ev) {
    case "normalize": markStep("normalize", "done", elapsed()); markStep("intent", "active"); break;
    case "link": markStep("intent", "done"); markStep("link", "done", elapsed()); markStep("route", "active"); break;
    case "route": markStep("route", "done", elapsed()); markStep("generate", "active"); break;
    case "generate": markStep("generate", "done", elapsed()); markStep("guard", "active"); break;
    case "static_check": markStep("guard", "done", elapsed()); markStep("execute", "active"); break;
    case "answer": markStep("guard", "done"); markStep("execute", "done", elapsed()); break;
    case "clarify":
      markStep("intent", "done"); markStep("link", "done");
      markStep("route", "warn", "되물음"); skipFrom("generate", "SQL 생성 안 함"); break;
    case "blocked": {
      // 생성이 끝난 뒤의 차단이면 AST 가드, 그 전이면 요청 의도 가드에서 멈춘 것이다.
      const afterGen = stepEl("generate").classList.contains("done");
      markStep(afterGen ? "guard" : "intent", "stop", "차단");
      skipFrom(afterGen ? "execute" : "link", afterGen ? "실행 안 함" : "SQL 생성 안 함");
      break;
    }
    case "escalate": markStep("generate", "active", `→ ${esc(data.to)}`); break;
    case "repair": markStep("execute", "active", `자가교정 ${data.attempts}회`); break;
    default: break;
  }
}

/* ---------- run ---------------------------------------------------------- */
async function run() {
  const question = $("#q").value.trim();
  if (!question) { $("#q").focus(); return; }
  const btn = $("#run");
  btn.disabled = true; btn.classList.add("busy"); $("#runLbl").textContent = "실행 중";
  $("#out").innerHTML = ""; $("#live").classList.remove("hidden");
  t0 = performance.now(); resetSteps();
  try { window.history.replaceState(null, "", `?q=${encodeURIComponent(question)}`); } catch (e) { /* ignore */ }

  // 요청 시점의 컨텍스트를 고정한다 — 나중에 드롭다운을 바꿔도 이 응답의 기록은
  // 변하면 안 된다. 그래야 '이 응답의 재현 정보'라는 제목이 참이 된다.
  const sentCtx = sessionContext();
  try {
    const res = await fetch("/v1/query/stream", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ question, explain, max_rows: 100, context: sentCtx }),
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}${res.status === 503 ? " — 엔진이 아직 준비되지 않았습니다" : ""}`);
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const chunks = buf.split("\n\n");
      buf = chunks.pop();
      for (const chunk of chunks) {
        const ev = (chunk.match(/^event: (.*)$/m) || [])[1];
        const dataLine = (chunk.match(/^data: (.*)$/m) || [])[1];
        if (!ev || !dataLine) continue;
        const data = JSON.parse(dataLine);
        if (ev === "done") { data.context = sentCtx; setTimeout(() => $("#live").classList.add("hidden"), 300); render(data); }
        else if (ev === "error") {
          $("#live").classList.add("hidden");
          $("#out").appendChild(el("div", "panel panel-pad",
            `<div class="errbox"><b>오류</b><div>${esc(data.message)}</div></div>`));
        } else onStage(ev, data);
      }
    }
  } catch (e) {
    $("#live").classList.add("hidden");
    $("#out").appendChild(el("div", "panel panel-pad",
      `<div class="errbox"><b>요청 실패</b><div>${esc(e.message || e)}</div>` +
      `<div style="margin-top:6px;color:var(--muted)">서버가 떠 있는지 확인하세요 — <code>aegis serve</code></div></div>`));
  } finally {
    btn.disabled = false; btn.classList.remove("busy"); $("#runLbl").textContent = "실행";
  }
}

/* ---------- render ------------------------------------------------------- */
function render(d) {
  asked = [{ q: d.question, status: d.status }, ...asked.filter((h) => h.q !== d.question)].slice(0, 8);
  renderHistory();

  const out = $("#out");
  const st = STATUS[d.status] || { ko: d.status, icon: "●" };

  const head = el("div", "panel");
  const hrow = el("div", "verdict-head");
  hrow.appendChild(el("span", "badge b-" + d.status, `${st.icon} ${esc(st.ko)}`));
  if (d.route) {
    hrow.appendChild(el("span", "badge b-tier",
      esc(d.route.tier) + (d.route.escalated_from ? ` ← ${esc(d.route.escalated_from)}` : "")));
  }
  const ctx = d.context || {};
  if (Object.keys(ctx).length) {
    hrow.appendChild(el("span", "badge b-ctx", Object.entries(ctx).map(([k, v]) => `${k}=${v}`).join(" ")));
  }
  // 라벨 없는 맨 해시는 디버그 출력으로 읽힌다. 글리프는 hover 전용으로 두지
  // 않는다 — 터치 기기에 어포던스가 없고 정지 스크린샷에도 안 남는다.
  const tid = el("button", "traceid",
    `<span class="tl">트레이스</span> ${esc(d.trace_id)} <span class="cg" aria-hidden="true">⧉</span>`);
  tid.title = "trace id 복사";
  tid.onclick = () => copy(d.trace_id, "trace id");
  hrow.appendChild(tid);
  head.appendChild(hrow);

  // 되묻기 문구는 아래 패널에서 크게 보여주므로 여기서 중복 출력하지 않는다.
  if (d.answer && !d.clarification) head.appendChild(el("div", "answer", esc(d.answer)));

  // 1행에는 사람이 읽는 것만 두고, 라우터 산문은 접는다. 근거를 없애는 게
  // 아니라 기본 접힘 — 펼치면 전문이 그대로 나온다.
  const bits = [];
  if (d.linked_tables?.length) bits.push("테이블 " + d.linked_tables.map((t) => `<code>${esc(t)}</code>`).join(" "));
  if (d.glossary_terms?.length) bits.push("용어사전 " + d.glossary_terms.map((t) => `<code>${esc(t)}</code>`).join(" "));
  if (bits.length) head.appendChild(el("div", "reason", bits.join(" &nbsp;·&nbsp; ")));
  if (d.route?.reason) {
    const det = el("details", "routewhy");
    det.innerHTML = `<summary>라우팅 근거</summary><div>${esc(d.route.reason)}</div>`;
    head.appendChild(det);
  }

  const k = el("div", "kpis");
  const kpi = (label, value, cls, title) => {
    const b = el("div", "kpi" + (cls ? " " + cls : ""));
    if (title) b.title = title;
    b.appendChild(el("div", "k", esc(label)));
    b.appendChild(el("div", "v", value));
    return b;
  };
  k.appendChild(kpi("지연", `${fmt(d.latency_ms)}<small>ms</small>`));
  k.appendChild(kpi("비용", d.cost_usd > 0 ? `$${d.cost_usd.toFixed(6)}` : "$0",
    d.cost_usd > 0 ? "" : "free", "LLM 토큰 비용 — 답변 합성 같은 보조 호출까지 포함합니다"));
  if (d.route) {
    k.appendChild(kpi("저티어 성공 예측", d.route.confidence.toFixed(2), "",
      "라우터가 예측한 '값싼 티어가 이 질문을 맞힐 확률'입니다 — 답이 맞을 확률이 아닙니다."));
    k.appendChild(kpi("난이도", d.route.difficulty.toFixed(2), "",
      "1 − 저티어 성공 예측. 학습된 라우터의 온도 보정 출력입니다."));
  }
  if (d.result) {
    k.appendChild(kpi("결과", `${fmt(d.result.row_count)}<small>행</small>`));
    k.appendChild(kpi("DB 실행", `${fmt(d.result.elapsed_ms, 1)}<small>ms</small>`));
  }
  head.appendChild(k);
  if (d.status === "ok" && d.sql) head.appendChild(feedbackBar(d));
  out.appendChild(head);

  if (d.violations?.length || d.rewrites?.length) out.appendChild(governancePanel(d));
  const rowPol = (d.rewrites || []).filter((x) => String(x).startsWith("row-policy:"));
  if (d.status === "ok" && rowPol.length && d.result) out.appendChild(policyCompare(d, rowPol));
  if (d.clarification) out.appendChild(clarifyPanel(d));
  out.appendChild(tabsPanel(d));
}

/* 이 데모에서 가장 희소한 그림: 같은 질문이 묻는 사람에 따라 다른 SQL 로 실행된다.
   생성된 SQL 은 바이트 단위로 같고 executed_sql 만 다르다.  그래서 이 버튼은
   rewrites 에 row-policy 가 실제로 걸린 응답에서만 나타난다 — 차이가 보장된
   자리에서만 등장하므로 평소 화면에 없고, 눌렀을 때 헛발질하지 않는다. */
function policyCompare(d, rowPol) {
  const box = el("div", "panel cmp");
  box.appendChild(el("div", "panel-title",
    `이 결과에는 행 수준 정책이 걸려 있습니다 — ${rowPol.map((x) => x.slice(11)).join(", ")}`));
  const bar = el("div", "fb");
  bar.appendChild(el("span", null,
    "생성된 SQL 은 그대로입니다. 달라지는 것은 정책이 주입한 WHERE 절뿐입니다."));
  const btn = el("button", "copybtn", "정책 없이 실행해 비교");
  bar.appendChild(btn);
  box.appendChild(bar);

  btn.onclick = async () => {
    btn.disabled = true; btn.textContent = "실행 중…";
    try {
      const res = await fetch("/v1/query", {
        method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ question: d.question, max_rows: 100, context: {} }),
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const b = await res.json();
      // 행수만 비교하면 안 된다.  '지역별 고객 수' 는 정책이 걸려도 11행 그대로이고
      // 값만 절반으로 준다 — 행수만 보여주면 두 칸이 똑같아 보이고, 그게 바로
      // '필터가 조용히 들어간다' 는 이 데모의 요점을 정면으로 놓치는 것이다.
      const topRows = (resp) => {
        const r = resp.result || {};
        if (!r.rows || !r.rows.length) return "결과 없음";
        const meta = colMeta(r);
        return r.rows.slice(0, 3).map((row) =>
          row.map((v, i) => (v === null ? "∅" : esc(fmtCell(v, meta[i].kind)))).join(" · ")
        ).join("<br/>");
      };
      const cell = (title, resp, ctxLabel) => {
        const c = el("div", "cmpcell");
        c.appendChild(el("div", "ch", esc(title)));
        c.appendChild(el("div", "cn", `${fmt((resp.result || {}).row_count ?? 0)}행`));
        const where = whereOf(resp.executed_sql);
        c.appendChild(el("div", "cr",
          `세션 <span>${esc(ctxLabel)}</span><br/>` +
          `주입된 조건 <span>${where ? esc(where) : "없음"}</span><br/>` +
          `상위 3행<br/><span>${topRows(resp)}</span>`));
        return c;
      };
      const ctxNow = Object.entries(d.context || {}).map(([k, v]) => `${k}=${v}`).join(" ") || "기본";
      const grid = el("div", "cmpgrid");
      grid.appendChild(cell("현재 세션", d, ctxNow));
      grid.appendChild(cell("정책 없이", b, "컨텍스트 없음"));
      box.appendChild(grid);
      const n1 = (d.result || {}).row_count ?? 0, n2 = (b.result || {}).row_count ?? 0;
      const same = JSON.stringify((d.result || {}).rows) === JSON.stringify((b.result || {}).rows);
      box.appendChild(el("div", "chartnote", esc(
        same ? "두 결과가 동일합니다 — 이 질문에는 정책이 실질적으로 작용하지 않았습니다."
             : n1 === n2
               ? `행수는 ${fmt(n1)}행으로 같지만 값이 다릅니다 — 필터가 조용히 들어간 경우입니다.`
               : `${fmt(n2)}행 → ${fmt(n1)}행으로 줄었습니다.`)));
      bar.remove();
    } catch (e) {
      btn.disabled = false; btn.textContent = "정책 없이 실행해 비교";
      box.appendChild(el("div", "errbox", esc(`비교 실행에 실패했습니다 — ${e.message}`)));
    }
  };
  return box;
}
/* 실행 SQL 에서 정책이 넣은 조건만 뽑아 한 줄로 보여준다 (없으면 빈 문자열). */
function whereOf(sql) {
  const m = /\bWHERE\b([\s\S]*?)(\bGROUP\b|\bORDER\b|\bLIMIT\b|$)/i.exec(String(sql || ""));
  if (!m) return "";
  const w = m[1].replace(/\s+/g, " ").trim();
  return w.length > 120 ? w.slice(0, 118) + "…" : w;
}

function feedbackBar(d) {
  const bar = el("div", "fb");
  bar.appendChild(el("span", null, "이 답변이 맞나요? 피드백은 플라이휠의 선호쌍으로 적재됩니다"));
  const send = async (correct, corrected) => {
    try {
      const res = await fetch("/v1/feedback", {
        method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ trace_id: d.trace_id, question: d.question, sql: d.sql,
                               correct, corrected_sql: corrected || null, comment: "" }),
      });
      // fetch 는 HTTP 500 에 reject 하지 않는다 — 응답을 읽지 않으면 저장에
      // 실패해도 화면은 성공이라고 말한다. 서버 경로를 화면에 쓰지도 않는다.
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const body = await res.json().catch(() => ({ ok: false }));
      bar.innerHTML = body.ok
        ? `<span class="done">✓ 기록했습니다 — 플라이휠의 선호쌍으로 적재됩니다</span>`
        : `<span class="done">기록하지 않았습니다 — ${esc(body.reason || "저장할 수 없습니다")}</span>`;
    } catch (e) { toast("피드백 전송 실패"); }
  };
  const good = el("button", null, "👍 정답");
  good.onclick = () => send(true);
  const bad = el("button", null, "👎 오답 · 정정 SQL");
  bad.onclick = () => {
    bar.innerHTML = "";
    const ta = el("textarea"); ta.value = d.sql; ta.style.minHeight = "88px";
    const ok = el("button", null, "정정 SQL 제출");
    ok.onclick = () => send(false, ta.value);
    bar.appendChild(ta); bar.appendChild(ok);
  };
  bar.appendChild(good); bar.appendChild(bad);
  return bar;
}

function governancePanel(d) {
  const p = el("div", "panel panel-pad");
  p.appendChild(el("div", "panel-title", "거버넌스"));
  (d.violations || []).forEach((v) => {
    const warn = (v.severity || "").toLowerCase() !== "block";
    p.appendChild(el("div", "viol" + (warn ? " warn" : ""),
      `<span aria-hidden="true">${warn ? "▲" : "■"}</span><div><code>${esc(v.code)}</code> ` +
      `<span class="sub">${esc(v.severity)}${v.subject ? " · " + esc(v.subject) : ""}</span>` +
      `<div class="msg">${esc(v.message)}</div></div>`));
  });
  if (d.rewrites?.length) {
    const r = el("div", "rewrites", `<span style="font-size:12px;color:var(--muted)">자동 재작성</span>`);
    d.rewrites.forEach((x) => r.appendChild(el("span", "tag", esc(x))));
    p.appendChild(r);
  }
  return p;
}

function clarifyPanel(d) {
  const p = el("div", "panel panel-pad");
  p.appendChild(el("div", "panel-title", "되묻기 — 추측하지 않습니다"));
  p.appendChild(el("div", null, `<div style="font-size:15px">${esc(d.clarification.question || "")}</div>`));
  const opts = el("div", "opts");
  (d.clarification.options || []).forEach((o) => {
    const b = el("button", "opt", esc(o));
    b.onclick = () => { $("#q").value = d.question.replace(/\s*\([^)]*기준\)$/, "") + ` (${o} 기준)`; run(); };
    opts.appendChild(b);
  });
  p.appendChild(opts);
  if (d.clarification.reasons?.length) {
    p.appendChild(el("div", "reasons", d.clarification.reasons.map((r) => "· " + esc(r)).join("<br/>")));
  }
  return p;
}

/** 탭이 비어 있는 이유는 상태마다 다르다 — 툴팁이 아니라 본문으로 설명한다. */
function whyEmpty(name, d) {
  if (name === "결과") {
    if (d.status === "blocked")
      return ["실행된 쿼리가 없습니다", "거버넌스가 요청을 차단해 SQL을 만들지도, 실행하지도 않았습니다. 차단은 의도된 정상 동작입니다."];
    if (d.status === "clarify")
      return ["실행된 쿼리가 없습니다", "질문이 모호해 되물었습니다. 추측해서 그럴듯한 숫자를 만드는 대신 기준을 먼저 확인합니다 — 위 선택지를 고르면 실행됩니다."];
    return ["결과가 없습니다", "실행 단계까지 진행되지 않았습니다."];
  }
  if (name === "SQL") {
    if (d.status === "blocked")
      return ["생성된 SQL이 없습니다", "요청 의도 단계에서 거부되어 생성 이전에 멈췄습니다. 트레이스 탭을 보면 generate 스팬이 없다는 것이 확인됩니다."];
    if (d.status === "clarify")
      return ["생성된 SQL이 없습니다", "모호성 탐지가 먼저 걸려 생성 단계로 가지 않았습니다."];
    return ["생성된 SQL이 없습니다", "생성 이전에 종료되었습니다."];
  }
  if (name === "자가교정") {
    if (d.status === "ok")
      return ["교정 기록이 없습니다", "처음 만든 SQL이 그대로 실행됐습니다. 교정은 실행이 실패했거나 정적 결함(날짜 형식·코드 리터럴 불일치)이 발견됐을 때만 동작합니다."];
    return ["교정 기록이 없습니다", "실행 단계에 도달하지 않아 교정할 SQL 자체가 없습니다."];
  }
  if (!explain)
    return ["근거 표시가 꺼져 있습니다", "위 스위치를 켜면 링킹 근거와 스팬 트레이스가 응답에 포함됩니다."];
  return ["표시할 내용이 없습니다", "이 경로에서는 해당 산출물이 만들어지지 않았습니다."];
}

function tabsPanel(d) {
  const specs = [
    { name: "결과", count: d.result ? d.result.row_count : 0, on: !!d.result, make: () => resultTable(d.result, d) },
    { name: "SQL", on: !!d.sql, make: () => sqlPane(d) },
    { name: "링킹 근거", count: d.evidence?.length || 0, on: !!d.evidence?.length, make: () => evidencePane(d.evidence) },
    { name: "트레이스", on: !!d.trace, make: () => tracePane(d.trace, d) },
    { name: "자가교정", count: d.repairs?.length || 0, on: !!d.repairs?.length, make: () => repairPane(d.repairs) },
  ];
  const p = el("div", "panel");
  const bar = el("div", "tabs");
  bar.setAttribute("role", "tablist");
  const body = el("div", "tabbody");
  body.setAttribute("role", "tabpanel");
  const first = Math.max(0, specs.findIndex((s) => s.on));

  const show = (i) => {
    const tabs = [...bar.querySelectorAll(".tab")];
    tabs.forEach((x, j) => x.setAttribute("aria-selected", String(i === j)));
    body.innerHTML = "";
    const s = specs[i];
    if (s.on) {
      try { body.appendChild(s.make()); }
      catch (err) {  // 패널 하나가 깨져도 화면 전체를 비우지 않는다
        body.appendChild(el("div", "errbox", `<b>표시 오류</b><div>${esc(err.message || err)}</div>`));
      }
      return;
    }
    const [title, sub] = whyEmpty(s.name, d);
    const inner = el("div", null, `<b>${esc(title)}</b><span class="sub">${esc(sub)}</span>`);
    const box = el("div", "whybox", `<span aria-hidden="true">ⓘ</span>`);
    box.appendChild(inner);
    if (!explain && (s.name === "링킹 근거" || s.name === "트레이스")) {
      const b = el("button", "btn sm", "근거 켜고 다시 실행");
      b.style.marginTop = "10px";
      b.onclick = () => { setExplain(true); $("#q").value = d.question; run(); };
      inner.appendChild(b);
    }
    body.appendChild(box);
  };

  specs.forEach((s, i) => {
    const t = el("button", "tab",
      esc(s.name) + (s.count ? ` <span class="cnt">${fmt(s.count)}</span>` : ""));
    t.setAttribute("role", "tab");
    t.setAttribute("aria-selected", String(i === first));
    // 비어 있는 탭도 '왜 비었는지'를 여는 살아 있는 컨트롤이다.
    // aria-disabled 를 붙이면 보조기술이 조작 불가로 읽어 그 설명에 닿을 수 없다.
    if (!s.on) t.dataset.empty = "true";
    t.onclick = () => show(i);
    t.onkeydown = (e) => {
      if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
      e.preventDefault();
      const tabs = [...bar.querySelectorAll(".tab")];
      const nx = (tabs.indexOf(t) + (e.key === "ArrowRight" ? 1 : tabs.length - 1)) % tabs.length;
      tabs[nx].focus(); show(nx);
    };
    bar.appendChild(t);
  });
  p.appendChild(bar); p.appendChild(body);
  show(first);
  return p;
}

/* ---------- panes -------------------------------------------------------- */
/* 열 단위로 서식을 한 번 정하고 그 열 전체에 같은 단위를 적용한다.
   이걸 하기 전에는 답변 문장이 "비율: 16.72%" 라고 말하는 바로 밑에서 표가
   0.16715384615384615 를 찍고 있었다 — 같은 화면의 두 숫자가 서로 달라 보였다.
   표시만 바꾸고 CSV·복사는 원값을 내보낸다. */
function colMeta(r) {
  return r.columns.map((name, i) => {
    const vals = r.rows.map((row) => row[i]).filter((v) => v !== null && v !== undefined);
    const numeric = vals.length > 0 && vals.every((v) => typeof v === "number");
    if (!numeric) return { numeric: false, kind: "text" };
    const abs = vals.map(Math.abs);
    const max = abs.length ? Math.max(...abs) : 0;
    const allInt = vals.every((v) => Number.isInteger(v));
    const named = /비율|비중|율$|률$|rate|ratio/i.test(name);
    const ranged = max <= 1 && !allInt;
    if (named || ranged) return { numeric: true, kind: "pct" };
    if (allInt && max >= 1e8) return { numeric: true, kind: "eok" };
    return { numeric: true, kind: allInt ? "int" : "dec" };
  });
}
function fmtCell(v, kind) {
  if (typeof v !== "number") return String(v);
  if (kind === "pct") return (v * 100).toFixed(2) + "%";
  if (kind === "eok") return (v / 1e8).toLocaleString(undefined, { maximumFractionDigits: 1 }) + "억";
  if (kind === "int") return v.toLocaleString();
  return v.toLocaleString(undefined, { maximumFractionDigits: 2 });
}
/* RFC 4180 — 쉼표·따옴표·줄바꿈이 든 값을 감싸지 않으면 열이 어긋난다.
   이전 코드는 row.join(",") 이라 이스케이프가 아예 없었다. */
function csvCell(v) {
  if (v === null || v === undefined) return "";
  const t = String(v);
  return /[",\n\r]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
}
function toCsv(r) {
  return [r.columns.map(csvCell).join(","), ...r.rows.map((row) => row.map(csvCell).join(","))].join("\n");
}

/* 마스킹된 컬럼을 결과 표의 머리에서 바로 알린다.  지금까지는 원인(판정 헤더의
   mask:TB_CUST.TELNO 태그)과 결과(010-****-1821)가 화면에서 멀리 떨어져 있었다.
   매핑은 rewrites 의 물리 컬럼명 → /v1/schema 의 컬럼 주석 → 결과 컬럼명 순이고,
   못 찾으면 조용히 아무것도 붙이지 않는다. */
function maskedLabels(d) {
  const out = new Set();
  if (!schemaCache || !d.rewrites) return out;
  const wanted = d.rewrites
    .filter((x) => String(x).startsWith("mask:"))
    .map((x) => String(x).slice(5));
  if (!wanted.length) return out;
  (schemaCache.tables || []).forEach((t) => {
    (t.columns || []).forEach((c) => {
      const phys = `${t.name}.${c.name}`;
      if (wanted.includes(phys) || wanted.includes(c.name)) {
        if (c.comment) out.add(c.comment);
        out.add(c.name);
      }
    });
  });
  return out;
}

/* 차트는 모양이 맞을 때만 나타난다.  1행 스칼라를 막대로 그리면 없느니만 못하다. */
function chartSpec(r, meta) {
  if (!r || !r.rows || !r.rows.length) return null;
  const num = meta.map((m, i) => (m.numeric ? i : -1)).filter((i) => i >= 0);
  const lab = meta.map((m, i) => (m.numeric ? -1 : i)).filter((i) => i >= 0);
  if (r.rows.length === 1 && r.columns.length === 1 && num.length === 1) {
    return { kind: "big", vi: num[0] };
  }
  if (lab.length >= 1 && num.length >= 1 && r.rows.length >= 2 && r.rows.length <= 40) {
    const li = lab[0], vi = num[0];
    const labels = r.rows.map((row) => row[li]);
    const series = labels.every((v) => v !== null && /^(19|20)\d{2}((0[1-9])|(1[0-2]))?$/.test(String(v)));
    return { kind: series ? "line" : "bar", li, vi };
  }
  return null;
}
function chartNote(r) {
  const shown = r.rows.length;
  if (r.row_count > shown) return `전체 ${fmt(r.row_count)}행 중 ${fmt(shown)}행 기준 — 나머지는 표시 상한으로 잘렸습니다`;
  return "";
}
function renderChart(r, meta, spec) {
  const box = el("div", "chartbox");
  if (spec.kind === "big") {
    const v = r.rows[0][spec.vi];
    const tile = el("div", "bignum");
    tile.appendChild(el("div", "v", esc(fmtCell(v, meta[spec.vi].kind))));
    tile.appendChild(el("div", "k", esc(r.columns[spec.vi])));
    box.appendChild(tile);
    return box;
  }
  const rows = r.rows.filter((row) => row[spec.li] !== null && typeof row[spec.vi] === "number");
  const dropped = r.rows.length - rows.length;
  const vals = rows.map((row) => Number(row[spec.vi]));
  const max = Math.max(...vals.map(Math.abs), 0);
  const kind = meta[spec.vi].kind;

  if (spec.kind === "line") {
    // y축을 0에 고정하면 83~114 같은 구간이 화면 위쪽에 눌려 평평해 보인다.
    // 데이터 범위를 쓰되 최소·최대를 축에 그대로 찍어 스케일을 감추지 않는다.
    const W = 640, H = 190, PAD = 26;
    const vmin = Math.min(...vals), vmax = Math.max(...vals);
    const span = (vmax - vmin) || Math.abs(vmax) || 1;
    const lo = vmin - span * 0.12, hi = vmax + span * 0.12;
    const x = (i) => PAD + (i * (W - PAD * 2)) / Math.max(1, rows.length - 1);
    const y = (v) => H - PAD - ((v - lo) / (hi - lo || 1)) * (H - PAD * 2);
    const pts = vals.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
    const first = String(rows[0][spec.li]), last = String(rows[rows.length - 1][spec.li]);
    const svg =
      `<svg viewBox="0 0 ${W} ${H}" width="100%" height="190" role="img" ` +
      `aria-label="${esc(r.columns[spec.li])}별 ${esc(r.columns[spec.vi])} 추이 — 최소 ${esc(fmtCell(Math.min(...vals), kind))}, 최대 ${esc(fmtCell(Math.max(...vals), kind))}">` +
      `<line x1="${PAD}" y1="${H - PAD}" x2="${W - PAD}" y2="${H - PAD}" stroke="var(--line)" stroke-width="1"/>` +
      `<polyline fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" points="${pts}"/>` +
      vals.map((v, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="2.5" fill="var(--accent)"/>`).join("") +
      `<text x="${PAD}" y="${H - 8}" font-size="10" fill="var(--muted)">${esc(first)}</text>` +
      `<text x="${W - PAD}" y="${H - 8}" font-size="10" fill="var(--muted)" text-anchor="end">${esc(last)}</text>` +
      `<text x="${PAD}" y="${(y(vmax) - 8).toFixed(1)}" font-size="10" fill="var(--muted)">${esc(fmtCell(vmax, kind))}</text>` +
      `<text x="${PAD}" y="${(y(vmin) + 14).toFixed(1)}" font-size="10" fill="var(--muted)">${esc(fmtCell(vmin, kind))}</text>` +
      `</svg>`;
    box.innerHTML = svg;
  } else {
    rows.forEach((row) => {
      const v = Number(row[spec.vi]);
      const pct = max > 0 ? Math.max(1.5, (Math.abs(v) / max) * 100) : 0;
      box.appendChild(el("div", "cbar",
        `<span class="cl" title="${esc(String(row[spec.li]))}">${esc(String(row[spec.li]))}</span>` +
        `<span class="barbox"><i class="barfill" style="width:${pct.toFixed(1)}%"></i></span>` +
        `<span class="cv">${esc(fmtCell(v, kind))}</span>`));
    });
  }
  const notes = [chartNote(r), dropped ? `라벨이 비어 있는 ${dropped}행 제외` : ""].filter(Boolean);
  if (notes.length) box.appendChild(el("div", "chartnote", esc(notes.join(" · "))));
  return box;
}

/* ---------- panes -------------------------------------------------------- */
function resultTable(r, d) {
  const box = el("div");
  const meta = colMeta(r);
  const numeric = meta.map((m) => m.numeric);
  const masked = maskedLabels(d || {});
  const barCol = numeric.lastIndexOf(true);
  const maxVal = barCol >= 0 ? Math.max(...r.rows.map((row) => Math.abs(Number(row[barCol]) || 0)), 0) : 0;

  if (!r.rows.length) {
    box.appendChild(el("div", "whybox",
      "조건에 맞는 행이 0건입니다 — SQL 은 정상적으로 실행되었습니다. " +
      `(DB ${fmt(r.elapsed_ms, 1)}ms)`));
    return box;
  }

  const wrap = el("div", "tablewrap");
  const t = el("table");
  const trh = el("tr");
  r.columns.forEach((c, i) => trh.appendChild(el("th", numeric[i] ? "num" : null,
    esc(c) + (masked.has(c) ? '<span class="lock" title="거버넌스 정책에 따라 마스킹된 컬럼입니다">🔒 마스킹</span>' : ""))));
  if (barCol >= 0 && maxVal > 0) trh.appendChild(el("th", null, ""));
  const thead = el("thead"); thead.appendChild(trh); t.appendChild(thead);
  const tb = el("tbody");
  r.rows.forEach((row) => {
    const tr = el("tr");
    row.forEach((v, i) => {
      const isNum = typeof v === "number";
      const td = el("td", isNum ? "num" : null,
        v === null ? '<span class="nul">∅</span>' : esc(fmtCell(v, meta[i].kind)));
      if (isNum) td.title = String(v);
      tr.appendChild(td);
    });
    if (barCol >= 0 && maxVal > 0) {
      const pct = Math.max(2, (Math.abs(Number(row[barCol]) || 0) / maxVal) * 100);
      tr.appendChild(el("td", "bar",
        `<div class="barbox"><i class="barfill" style="width:${pct.toFixed(1)}%"></i></div>`));
    }
    tb.appendChild(tr);
  });
  t.appendChild(tb); wrap.appendChild(t);

  const spec = chartSpec(r, meta);
  const view = el("div");
  // 스칼라는 표가 아니라 숫자 하나가 답이다 — 헤더 한 칸짜리 표는 결과가 아니라 잔해다.
  let mode = spec && spec.kind === "big" ? "chart" : "table";
  const paint = () => {
    view.innerHTML = "";
    view.appendChild(mode === "chart" ? renderChart(r, meta, spec) : wrap);
  };
  box.appendChild(view);

  const foot = el("div", "tablefoot");
  foot.appendChild(el("span", null,
    `${fmt(r.row_count)}행 · DB ${fmt(r.elapsed_ms, 1)}ms${r.truncated ? " · 표시 상한" : ""}`));
  foot.appendChild(el("span", "spacer"));
  if (spec) {
    const tog = el("div", "viewtog");
    const mk = (m, lbl) => {
      const b = el("button", null, lbl);
      b.setAttribute("aria-pressed", String(mode === m));
      b.onclick = () => {
        mode = m;
        tog.querySelectorAll("button").forEach((x, i) => x.setAttribute("aria-pressed", String((i === 0) === (m === "table"))));
        paint();
      };
      return b;
    };
    tog.appendChild(mk("table", "표"));
    tog.appendChild(mk("chart", spec.kind === "big" ? "숫자" : "차트"));
    foot.appendChild(tog);
  }
  const cp = el("button", "copybtn", "CSV 복사");
  cp.onclick = () => copy(toCsv(r), "CSV");
  foot.appendChild(cp);
  box.appendChild(foot);
  paint();
  return box;
}

/* 한 번의 스캔으로 토큰을 분류한다 — 방금 넣은 마크업 위를 다시 훑지 않도록. */
const SQL_TOKEN = /(--[^\n]*)|('(?:[^']|'')*')|\b(SELECT|FROM|WHERE|GROUP\s+BY|ORDER\s+BY|LIMIT|JOIN|LEFT|RIGHT|INNER|OUTER|FULL|CROSS|ON|AS|AND|OR|NOT|IN|IS|NULL|COUNT|SUM|AVG|MIN|MAX|CAST|CASE|WHEN|THEN|ELSE|END|DISTINCT|BETWEEN|HAVING|WITH|OVER|PARTITION|UNION|ALL|EXISTS|LIKE|DESC|ASC|substr|strftime|ROUND|NULLIF|COALESCE|REAL|INTEGER|TEXT)\b|(\d+(?:\.\d+)?)/gi;
function highlight(sql) {
  const s = String(sql ?? "");
  let out = "", last = 0;
  SQL_TOKEN.lastIndex = 0;
  for (let m; (m = SQL_TOKEN.exec(s)); ) {
    out += esc(s.slice(last, m.index));
    const cls = m[1] ? "s-cm" : m[2] ? "s-str" : m[3] ? "s-kw" : "s-num";
    out += `<span class="${cls}">${esc(m[0])}</span>`;
    last = m.index + m[0].length;
  }
  return out + esc(s.slice(last));
}
function sqlBlock(box, label, sql, note) {
  const h = el("div", "codehead");
  h.appendChild(el("span", "lbl",
    esc(label) + (note ? ` <span style="color:var(--accent-ink)">${esc(note)}</span>` : "")));
  h.appendChild(el("span", "spacer"));
  const cp = el("button", "copybtn", "복사");
  cp.onclick = () => copy(sql, "SQL");
  h.appendChild(cp);
  box.appendChild(h);
  box.appendChild(el("pre", null, highlight(sql)));
}
/* 생성 SQL 은 여러 줄로 예쁘게 찍히고 실행 SQL 은 한 줄이라, 문자열 비교로는
   재작성이 없어도 항상 '다르다'가 나온다.  그래서 이 화면은 재작성이 0건인
   질의에서도 '거버넌스 재작성 적용됨' 을 띄우고 있었다 — 거버넌스를 주장하는
   데모가 거버넌스에 대해 거짓말하는 셈이다.  공백을 정규화해 실제로 다른지
   보고, 라벨은 rewrites 가 실제로 있을 때만 붙인다. */
const normSql = (x) => String(x ?? "").replace(/\s+/g, " ").trim();
function sqlPane(d) {
  const box = el("div");
  sqlBlock(box, "생성된 SQL", d.sql || "");
  if (d.executed_sql && normSql(d.executed_sql) !== normSql(d.sql)) {
    const rw = (d.rewrites || []).length;
    sqlBlock(box, "실제 실행된 SQL", d.executed_sql,
             rw ? `거버넌스 재작성 ${rw}건 적용됨` : null);
  }
  return box;
}

function evidencePane(ev) {
  const box = el("div");
  const max = Math.max(...ev.map((e) => e.score), 0.0001);
  ev.forEach((e) => {
    box.appendChild(el("div", "ev",
      `<span class="ref" title="${esc(e.ref)}">${esc(e.ref)}</span>` +
      `<span class="barbox"><i class="barfill" style="width:${((e.score / max) * 100).toFixed(1)}%"></i></span>` +
      `<span class="sc">${e.score.toFixed(3)}</span><span class="src">${esc(e.source)}</span>`));
  });
  return box;
}

/** 서버가 보내는 offset_ms 를 그대로 쓴다 — 클라이언트가 시작점을 지어내지 않는다. */
function flatten(span, depth, list) {
  list.push({ span, depth });
  (span.children || []).forEach((c) => flatten(c, depth + 1, list));
  return list;
}
/** 이 응답의 재현 정보 — 지문·프롬프트는 페이지의 각주가 아니라 이 응답의 속성이다.
 *  면접에서 "이 답이 어떤 스키마·어떤 프롬프트 버전에서 나왔습니까"를 받았을 때,
 *  화면 맨 아래 회색 줄을 스크롤해 가리키는 것과 격이 다르다. */
function provenance(d) {
  const rows = [];
  const h = healthCache;
  // 값이 없으면 '—' 로 채우지 않고 그 행을 렌더하지 않는다.
  if (h?.schema_fingerprint) rows.push(["스키마 지문", h.schema_fingerprint]);
  const gen = Object.entries(h?.prompts || {}).filter(([k]) => k.startsWith("nl2sql."));
  if (gen.length) rows.push(["프롬프트", gen.map(([, v]) => v).join("  ")]);
  if (d.route?.tier) {
    const from = d.route.escalated_from;
    rows.push(["생성 티어", d.route.tier + (from ? ` (${from} 에서 승격)` : "")]);
  }
  const ctx = d.context || {};
  rows.push(["세션 컨텍스트",
    Object.keys(ctx).length ? Object.entries(ctx).map(([k, v]) => `${k}=${v}`).join(" · ") : "없음 (본사 · 목적 일반)"]);
  if (d.trace_id) rows.push(["trace id", d.trace_id]);
  if (!rows.length) return null;

  const box = el("div", "prov");
  box.appendChild(el("div", "ph", "이 응답의 재현 정보"));
  rows.forEach(([k, v]) =>
    box.appendChild(el("div", "pr", `<span class="pk">${esc(k)}</span><span class="pv">${esc(v)}</span>`)));
  const b = el("button", "copybtn", "JSON 복사");
  b.style.marginTop = "10px";
  b.onclick = () => copy(JSON.stringify(Object.fromEntries(rows), null, 2), "재현 정보");
  box.appendChild(b);
  return box;
}

function tracePane(root, d) {
  const box = el("div");
  if (d) { const pv = provenance(d); if (pv) box.appendChild(pv); }
  const total = root.duration_ms || 1;
  flatten(root, 0, []).forEach(({ span, depth }) => {
    const attrs = Object.entries(span.attributes || {})
      .filter(([, v]) => typeof v !== "object")
      .slice(0, 4).map(([k, v]) => `${k}=${v}`).join(" ");
    const left = Math.min(99, Math.max(0, ((span.offset_ms || 0) / total) * 100));
    const width = Math.max(1.2, Math.min(100 - left, (span.duration_ms / total) * 100));
    box.appendChild(el("div", "tr",
      `<span class="nm" style="padding-left:${depth * 13}px">${esc(span.name)}` +
      (attrs ? `<span class="at">${esc(attrs)}</span>` : "") + `</span>` +
      `<span class="gantt"><i style="left:${left.toFixed(1)}%;width:${width.toFixed(1)}%"></i></span>` +
      `<span class="ms">${span.duration_ms.toFixed(1)}ms</span>`));
  });
  return box;
}

function repairPane(rs) {
  const box = el("div");
  rs.forEach((r) => {
    box.appendChild(el("div", "rep",
      `<div class="hd"><span style="color:${r.fixed ? "var(--good)" : "var(--critical)"}">${r.fixed ? "✓" : "✕"}</span>` +
      `<b>${esc(r.strategy)}</b><span style="color:var(--muted);font-size:12px">시도 ${r.attempt}</span></div>` +
      `<div class="err">${esc(r.error)}</div><pre>${highlight(r.after_sql || "")}</pre>`));
  });
  return box;
}

/* ---------- governance sandbox ------------------------------------------- */
async function checkPolicy() {
  const sql = $("#gsql").value.trim();
  if (!sql) return;
  const out = $("#gout");
  out.innerHTML = "";
  try {
    const res = await fetch("/v1/policy/check", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ sql, context: sessionContext() }),
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const d = await res.json();

    const head = el("div", "panel");
    const hrow = el("div", "verdict-head");
    hrow.appendChild(el("span", "badge " + (d.allowed ? "b-ok" : "b-blocked"),
      d.allowed ? "● 허용" : "■ 차단"));
    const ctx = sessionContext();
    if (Object.keys(ctx).length) {
      hrow.appendChild(el("span", "badge b-ctx", Object.entries(ctx).map(([k, v]) => `${k}=${v}`).join(" ")));
    }
    head.appendChild(hrow);
    head.appendChild(el("div", "reason", d.allowed
      ? "이 문장은 정책을 통과합니다. 아래 재작성이 적용된 형태로만 실행됩니다."
      : "이 문장은 실행될 수 없습니다. 아래 위반 사유를 확인하세요."));
    out.appendChild(head);

    if (d.violations?.length || d.rewrites?.length) {
      out.appendChild(governancePanel({ violations: d.violations, rewrites: d.rewrites }));
    }
    if (d.rewritten_sql) {
      const p = el("div", "panel panel-pad");
      p.appendChild(el("div", "panel-title", "정책 적용 후 SQL"));
      // 차단된 문장에도 재작성 결과는 나온다 — 마스킹·LIMIT 이 무엇을 했는지는
      // 보여주되, 그게 '실행될 SQL'로 오해되지 않도록 분명히 못 박는다.
      if (!d.allowed) {
        p.appendChild(el("div", "hint",
          "차단된 문장이므로 이 SQL은 실행되지 않습니다 — 위반 항목을 제거했을 때 " +
          "마스킹·LIMIT이 어떻게 적용되는지 보여주는 참고용입니다."));
      }
      sqlBlock(p, "재작성 결과", d.rewritten_sql);
      out.appendChild(p);
    }
    if (!d.violations?.length && !d.rewrites?.length && !d.rewritten_sql) {
      out.appendChild(el("div", "panel empty",
        "<h3>수정 없이 통과</h3><p>민감 컬럼도, 행 정책 대상도 아닙니다.</p>"));
    }
  } catch (e) {
    out.appendChild(el("div", "panel panel-pad",
      `<div class="errbox"><b>검사 실패</b><div>${esc(e.message || e)}</div></div>`));
  }
}

/* ---------- wire --------------------------------------------------------- */
function setExplain(on) {
  explain = on;
  $("#explainBtn").setAttribute("aria-pressed", String(on));
  $("#explainState").textContent = on ? "켬" : "끔";
}
$("#explainBtn").onclick = () => setExplain(!explain);
$("#run").onclick = run;
$("#q").addEventListener("keydown", (e) => {
  // 한글 입력 중의 Enter 는 '실행'이 아니라 '조합 확정'이다.  IME 가 조합을
  // 진행 중일 때는 isComposing 이 참이고, 이때 실행하면 마지막 글자가 빠진
  // 질문이 그대로 나간다 — 한국어 데모에서 가장 먼저 터지는 자리다.
  // keyCode 229 는 조합 중 keydown 을 그렇게 보고하는 오래된 경로의 대비책이다.
  if (e.key !== "Enter") return;
  if (e.isComposing || e.keyCode === 229) return;
  run();
});
$("#gcheck").onclick = checkPolicy;
document.addEventListener("keydown", (e) => {
  const tag = document.activeElement && document.activeElement.tagName;
  if (e.key === "/" && tag !== "INPUT" && tag !== "TEXTAREA") { e.preventDefault(); $("#q").focus(); }
});
function setMode(ask) {
  $("#modeAsk").setAttribute("aria-selected", String(ask));
  $("#modeGuard").setAttribute("aria-selected", String(!ask));
  $("#askMode").classList.toggle("hidden", !ask);
  $("#guardMode").classList.toggle("hidden", ask);
}
$("#modeAsk").onclick = () => setMode(true);
$("#modeGuard").onclick = () => setMode(false);

renderExamples();
loadHealth();
loadPolicy();
// 마스킹 배지는 schemaCache 의 컬럼 주석으로 결과 컬럼명을 맞춘다.  드로어를
// 열 때만 채우면 데모에서 배지가 영영 안 뜬다 — 부팅 때 미리 받아 둔다.
// 실패해도 조용히 넘어간다(배지가 안 붙을 뿐 결과 표는 그대로다).
if (!schemaCache) {
  fetch("/v1/schema").then((r) => r.json()).then((j) => { schemaCache = j; }).catch(() => {});
}

   카드도 일러스트도 쓰지 않고, 결과 배지와 같은 기호·같은 색만 쓴다. */

  ["gov", "■", "차단", "개인정보·DDL 요청은 SQL이 만들어지기 전에 거부합니다. 차단은 정상 동작입니다."],
  ["amb", "◆", "되묻기", "기준이 모호하면 그럴듯한 숫자를 지어내지 않고 먼저 되묻습니다."],
];

const initial = new URLSearchParams(location.search).get("q");
if (initial) { $("#q").value = initial; run(); }
else {
  const intro = el("div", "intro");
  intro.appendChild(el("p", "lead",
    "한국어로 물어보면 SQL로 답합니다. 거버넌스는 SQL이 만들어지기 <b>전에</b> 개입합니다."));
  intro.appendChild(el("div", "outcomes",
    OUTCOMES.map(([k, g, name, desc]) =>
      `<div class="outcome"><div class="hd"><span class="g ${k}" aria-hidden="true">${g}</span>` +
      `${esc(name)}</div><p>${esc(desc)}</p></div>`).join("")));
  intro.appendChild(el("p", "honest",
    "보험 도메인 샘플 스키마(11개 테이블, SQLite)에서 실제로 SQL을 실행합니다 — 미리 만들어둔 답이 아닙니다."));
  $("#out").appendChild(intro);
}
</script>
