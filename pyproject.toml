[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-sql"
version = "0.1.0"
description = "Governed, self-improving Korean Text-to-SQL engine for finance & insurance legacy schemas"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "sokldjs554" }]
keywords = ["text-to-sql", "llm", "rag", "korean", "nl2sql", "slm", "langchain", "fastapi"]

dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sse-starlette>=2.0",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    # exp.Attach 는 25.32 부터 있고, ATTACH 가드 테스트가 통과하는 최저선은
    # 27.4 다. >=23.0 은 만족하지만 import 조차 안 되는 거짓 선언이었다 —
    # 낡은 sqlglot 이 미리 깔린 환경(Colab 등)에서 그대로 드러난다.
    "sqlglot>=27.4",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "tenacity>=8.2",
    "prometheus-client>=0.20",
    "orjson>=3.10",
]

[project.optional-dependencies]
# LangChain orchestration + hosted LLM providers
llm = [
    "langchain>=0.2",
    "langchain-core>=0.2",
    "langchain-community>=0.2",
    "langchain-anthropic>=0.1",
    "langchain-openai>=0.1",
]
# PyTorch: in-house sLLM (custom Transformer + LoRA + SFT + DPO)
train = ["torch>=2.2"]
# TensorFlow/Keras: cascade router + confidence calibrator
router = ["tensorflow-cpu>=2.16"]
# Real vector databases (a pure-numpy store ships as the zero-dependency fallback)
vector = ["chromadb>=0.5", "faiss-cpu>=1.8", "sentence-transformers>=3.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-cov>=5.0", "ruff>=0.4", "mypy>=1.10", "tabulate>=0.9", "pandas>=2.2"]
all = ["aegis-sql[llm,train,router,vector,dev]"]

[project.scripts]
aegis = "aegis_sql.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aegis_sql = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
